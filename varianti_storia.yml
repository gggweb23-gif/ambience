{"name": "Copertine alternative Storia", "on": {"workflow_dispatch": {"inputs": {"video": {"description": "Parole del titolo dei video, separate da virgola (es. Egitto, India)", "default": "Egitto, India"}, "variante": {"description": "2 = con l'altra persona, 3 = elementi diversi, 2,3 = entrambe", "default": "2,3"}}}}, "permissions": {"contents": "read"}, "jobs": {"copertine": {"runs-on": "ubuntu-latest", "timeout-minutes": 40, "steps": [{"uses": "actions/checkout@v4"}, {"name": "Crea le copertine alternative (non carica niente su YouTube)", "env": {"VIDEO": "${{ inputs.video }}", "VARIANTE": "${{ inputs.variante }}", "APPLICA": "NO", "YT_CLIENT_ID": "${{ secrets.YT_CLIENT_ID }}", "YT_CLIENT_SECRET": "${{ secrets.YT_CLIENT_SECRET }}", "YT_REFRESH_TOKEN": "${{ secrets.YT_REFRESH_TOKEN_STORIA }}", "FAL_KEY": "${{ secrets.FAL_KEY }}", "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}"}, "run": "(pip install -q pillow || sudo apt-get install -y -qq python3-pil) && python3 copertine_storia.py"}, {"name": "Scarica le copertine", "if": "always()", "uses": "actions/upload-artifact@v4", "with": {"name": "copertine-alternative", "path": "copertine_storia/confronto.jpg\ncopertine_storia/*_2.jpg\ncopertine_storia/*_3.jpg", "if-no-files-found": "ignore"}}]}}}