<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:B;src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2');font-weight:800}
@font-face{font-family:B;src:url(fonts/baloo-2-latin-600-normal.woff2) format('woff2');font-weight:600}
html,body{margin:0;overflow:hidden;background:#fff}
svg{display:block}text{font-family:B,Inter,sans-serif}
</style></head>
<body><svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script src="lib.js"></script>
<script src="tpl.js"></script>
<script>
// MONTAGGIO: la timeline delle inquadrature arriva da video_cartoni.py (scene con tempi delle parole, inquadrature con parola di partenza)
const nrm = s => s.toLowerCase().replace(/[^a-zàèéìòù0-9]/g, '');
function trova(words, key) {
  const k = nrm(key || ''); if (!k) return null;
  for (const [w, a] of words) if (w === k) return a;
  if (k.length > 4) for (const [w, a] of words) if (w.startsWith(k) || k.startsWith(w) && w.length > 4) return a;
  for (const [w, a] of words) if (w.includes(k) && k.length > 3) return a;
  return null;
}
let TL = [], SCN = [], CTX = {};
window.init = (order, ctx) => {
  SCN = order; CTX = ctx || {}; TL = [];
  let n = 0;
  order.forEach(sc => {
    const words = sc.words.map(([w, a]) => [nrm(w), a]);
    let shots = (sc.shots || []).map((s, j) => ({ ...s, st: j === 0 ? 0 : trova(words, s.parola) }));
    // inquadrature senza parola trovata: a meta' tra le vicine (mai due nello stesso istante, mai piu' corte di 1,8 s)
    shots.forEach((s, j) => { if (s.st === null) s.st = j ? null : 0 });
    for (let j = 1; j < shots.length; j++) if (shots[j].st === null) { const nx = shots.slice(j + 1).find(x => x.st !== null); const a = shots[j - 1].st, b = nx ? nx.st : sc.dur; shots[j].st = a + (b - a) / 2 }
    shots.sort((a, b) => a.st - b.st);
    const ok = []; for (const s of shots) { if (!ok.length || s.st - ok[ok.length - 1].st >= 1.8) ok.push(s) }
    ok.forEach((s, j) => { s.g = sc.off + Math.max(0, s.st - .15); s.sc = sc; s.n = n++; const nx = ok[j + 1]; s.d = (nx ? nx.st : sc.dur) - s.st; TL.push(s) });
  });
  return TL.map(s => [s.sc.id, s.tipo, s.parola || '', +s.g.toFixed(2), +s.d.toFixed(2)]);
};
function disegna(s, gT) {
  const t = gT - s.g, C = { i: s.n, prot: CTX.protagonista, attivita: CTX.attivita, oggetto: CTX.oggetto };
  const f = TPL[s.tipo] || TPL.domanda;
  try { return f(t, Math.max(1.5, s.d), s.p || {}, C) } catch (e) { console.log('errore', s.sc.id, s.tipo, e.message); return TPL.domanda(t, s.d, { testo: '' }, C) }
}
const TR = .38;
function sottotitolo(gT) {
  for (const sc of SCN) { if (gT < sc.off || gT > sc.off + sc.dur) continue;
    const t = gT - sc.off; for (const c of sc.sub) if (t >= c.a && t <= c.b + .25) { const w = Math.min(1760, c.txt.length * 29 + 80); return `<rect x="${960 - w / 2}" y="996" width="${w}" height="68" rx="20" fill="${INK}" opacity=".88"/>` + T(960, 1043, S(c.txt), 46, '#fff', { w: 600 }) } }
  return '';
}
function capitolo(gT) {
  for (const sc of SCN) { const t = gT - sc.off; if (!sc.capitolo || t < 0 || t > 3.4) continue;
    const p = pop(t, .1, .5) * (1 - pr(t, 3, .4)); const w = sc.capitolo.length * 30 + 90;
    return tr(60, 60, 1, `<g transform="translate(${-(1 - cl(p)) * 900} 0)"><rect x="0" y="0" width="${w}" height="84" rx="42" fill="${INK}"/><rect x="0" y="0" width="84" height="84" rx="42" fill="${Y}"/>` + T(42, 58, '▶', 40, INK) + T(110, 58, S(sc.capitolo), 48, '#fff', { a: 'start' }) + `</g>`) }
  return '';
}
window.draw = (gT) => {
  let j = 0; while (j + 1 < TL.length && TL[j + 1].g <= gT) j++;
  const s = TL[j]; let out;
  if (j > 0 && gT - s.g < TR) {
    const p = E((gT - s.g) / TR), d = j % 2 ? 1 : -1;
    out = tr(-1920 * p * d, 0, 1, disegna(TL[j - 1], gT)) + tr(1920 * (1 - p) * d, 0, 1, disegna(s, gT));
  } else out = disegna(s, gT);
  document.getElementById('s').innerHTML = out + capitolo(gT) + sottotitolo(gT);
};
// COPERTINA 1280x720: scritta grande su 2-3 righe + protagonista + oggetto + cartellino
window.copertina = (c, ctx) => {
  const sv = document.getElementById('s'); sv.setAttribute('width', 1280); sv.setAttribute('height', 720); sv.setAttribute('viewBox', '0 0 1280 720');
  const C = { i: 3, prot: ctx.protagonista, attivita: ctx.attivita, oggetto: ctx.oggetto }, r = c.righe || [];
  const fondo = c.fondo === 'chiaro' ? '#FFE9C7' : '#2A3366';
  let s = `<rect width="1280" height="720" fill="${fondo}"/>` + (c.fondo === 'chiaro' ? '' : stars(1));
  s += prot(C, 960, 880, 1.25, .9, { mood: mood(c.emozione || 'stupito'), sweat: true, aL: 150, aR: -150 });
  if (c.oggetto) s += oggetto(c.oggetto, 1150, 250, .8, 0);
  if (c.prezzo) s += tr(1000, 140, .8, tag(0, 0, 1, S(c.prezzo)), -10);
  const yy = [60, 250, 400];
  r.slice(0, 3).forEach((x, i) => {
    const txt = S(String(x).toUpperCase());
    // 8 nov: riquadro largo quanto la scritta (prima "CENTESIMI" usciva dal riquadro rosso); scritta piu' piccola se non ci sta
    const fit = (fs) => { let f = fs; while (f > 56 && String(x).length * f * 0.64 + 80 > 760) f -= 4; return f; };
    const f0 = fit(txt.length > 13 ? 76 : 92), f2 = fit(txt.length > 12 ? 92 : 116), larg = (fs) => Math.min(780, String(x).length * fs * 0.64 + 80);
    if (i === 0) { const w = larg(f0); s += `<rect x="40" y="${yy[0]}" width="${w}" height="150" rx="24" fill="${Y}" ${SW}/>` + T(40 + w / 2, yy[0] + 105, txt, f0, INK); }
    else if (i === 1) s += T(60, yy[1] + 70, txt, fit(txt.length > 13 ? 84 : 104), '#fff', { a: 'start', st: INK, sw: 18 });
    else { const w = larg(f2); s += `<rect x="40" y="${yy[2]}" width="${w}" height="170" rx="24" fill="${R}" ${SW}/>` + T(40 + w / 2, yy[2] + 125, txt, f2, '#fff'); }
  });
  sv.innerHTML = s;
};
// ===== COPERTINA AI (8 nov 2026, Giorgio): bozza "COSTA / LO VENDI" che l'AI rifinisce, poi banda con targa e domanda (scritte sempre dal codice)
window.bozza_ai = (c) => {
  const sv = document.getElementById('s'); sv.setAttribute('width', 1280); sv.setAttribute('height', 720); sv.setAttribute('viewBox', '0 0 1920 1080');
  let s = `<rect width="1920" height="1080" fill="#1F2A44"/><path d="M0 0 H1060 L860 760 H0z" fill="#E8484F"/><path d="M1060 0 H1920 V760 H860z" fill="#23A866"/>`;
  s += T(330, 140, 'COSTA', 110, '#fff', {st: INK, sw: 22}) + oggetto(c.oggetto_sx || c.oggetto || 'scatola', 330, 380, 1.6, 0) + T(330, 640, S(c.valore_sx || ''), 120, Y, {st: INK, sw: 24});
  s += T(1480, 140, 'LO VENDI', 110, '#fff', {st: INK, sw: 22}) + oggetto(c.oggetto_dx || c.oggetto || 'scatola', 1480, 380, 1.9, 0) + T(1480, 640, S(c.valore_dx || ''), 130, Y, {st: INK, sw: 24});
  s += arrow(600, 400, 1160, 400, Y, 34) + `<rect x="0" y="760" width="1920" height="320" fill="${INK}"/>`;
  sv.innerHTML = s;
};
window.finale_ai = (img, r1, r2) => {
  const sv = document.getElementById('s'); sv.setAttribute('width', 1280); sv.setAttribute('height', 720); sv.setAttribute('viewBox', '0 0 1280 720');
  const V = '#23A866', t = (x, y, txt, fs, fill) => `<text x="${x}" y="${y}" font-size="${fs}" font-weight="800" fill="${fill}" text-anchor="middle">${txt}</text>`;
  const fit = (txt, fs, max) => { while (fs > 30 && String(txt).length * fs * .6 > max) fs -= 2; return fs; };
  let s = `<image href="${img}" x="0" y="0" width="1280" height="720"/><rect x="0" y="508" width="1280" height="212" fill="${INK}"/>`;
  s += `<g transform="translate(285 614) scale(1.02)"><rect x="-230" y="-62" width="460" height="124" rx="24" fill="#fff" stroke="${INK}" stroke-width="6"/><rect x="-230" y="-62" width="118" height="124" rx="24" fill="${V}" stroke="${INK}" stroke-width="6"/>`
    + `<g transform="translate(-171 4)"><g stroke="${INK}" stroke-width="5" fill="#fff"><rect x="-38" y="0" width="20" height="34"/><rect x="-11" y="-18" width="20" height="52"/><rect x="16" y="-38" width="20" height="72"/></g><path d="M-41 -14 L-9 -36 L17 -52 L31 -60" stroke="${Y}" stroke-width="6" fill="none" stroke-linecap="round"/></g>`
    + t(60, -6, "ECONOMIA D'IMPRESA", 29, INK) + t(60, 34, 'SPIEGATA FACILE', 28, V) + `</g>`;
  s += t(910, 598, S(String(r1 || '').toUpperCase()), fit(r1, 58, 560), '#fff') + t(910, 668, S(String(r2 || '').toUpperCase()), fit(r2, 66, 560), Y);
  sv.innerHTML = s;
};
</script></body></html>
