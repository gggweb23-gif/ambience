{"name": "Prova KAO Piatto", "on": {"workflow_dispatch": {"inputs": {"ultimi": {"description": "Quanti ultimi video (una copertina ciascuno)", "default": "8"}, "applica": {"description": "NO = solo prova | SI = carica le copertine su YouTube", "default": "NO"}}}}, "permissions": {"contents": "write"}, "jobs": {"prova": {"runs-on": "ubuntu-latest", "timeout-minutes": 90, "steps": [{"uses": "actions/checkout@v4"}, {"name": "Copertine KAO (KAO originale, copia 100% competitor, scritta magenta su cartoncino bianco)", "env": {"APPLICA": "${{ inputs.applica }}", "STILE": "piatto", "RIFAI": "SI", "ULTIMI": "${{ inputs.ultimi }}", "PROVA_SFONDI": "NO", "SFONDO_TESTO": "fumetto", "MAX_VIDEO": "60", "COACH": "NO", "COPERTINE_CSV": "${{ secrets.COPERTINE_CSV_KAO }}", "YT_CLIENT_ID": "${{ secrets.YT_CLIENT_ID }}", "YT_CLIENT_SECRET": "${{ secrets.YT_CLIENT_SECRET }}", "YT_REFRESH_TOKEN": "${{ secrets.YT_REFRESH_TOKEN_KAO }}", "FAL_KEY": "${{ secrets.FAL_KEY }}", "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}"}, "run": "(pip install -q pillow || sudo apt-get install -y -qq python3-pil) && python3 copertine_cinema_kao.py"}, {"name": "Salva nel repo (prove e copertine caricate)", "if": "always()", "run": "git config user.name render-bot && git config user.email render-bot@users.noreply.github.com && git add kao_copertine && git commit -m 'Copertine KAO piatto' && git pull --rebase -q origin main && git push || echo niente da salvare"}, {"name": "Scarica le copertine", "if": "always()", "uses": "actions/upload-artifact@v4", "with": {"name": "prova-kao-piatto", "path": "kao_copertine/piatto_prova\nkao_copertine/piatto\nkao_copertine/a_mano\nkao_copertine/cinema_anteprima.jpg", "if-no-files-found": "ignore"}}]}}}