name: Libreria personaggio a cartone
# 11 nov: pose ed espressioni del personaggio + secondari, una volta sola (circa 0,017 $ a figura).
on:
  workflow_dispatch:
    inputs:
      personaggio:
        description: 'Cartella in personaggi/ (es. kao)'
        default: 'kao'
      solo:
        description: 'Solo queste figure (nomi separati da virgola), vuoto = tutte quelle mancanti'
        default: ''
permissions:
  contents: write
jobs:
  libreria:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Figure
        env:
          PERSONAGGIO: ${{ inputs.personaggio }}
          SOLO: ${{ inputs.solo }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          pip install -q --break-system-packages pillow
          python3 strumenti/libreria_personaggio.py
      - name: Salva
        if: ${{ always() }}
        run: |
          git config user.name render-bot && git config user.email render-bot@users.noreply.github.com
          git add personaggi coach/costi 2>/dev/null; git commit -m "Libreria personaggio ${{ inputs.personaggio }}" && (for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done) || echo niente
