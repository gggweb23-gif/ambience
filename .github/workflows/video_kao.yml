name: Video KAO
# Tutto il video KAO su GitHub (prima lo facevano PRODUCTION + Publisher di n8n): copione, voce, montaggio, copertina, caricamento.
# Lo lancia n8n ("MULTICHANNEL - GitHub Video") quando nella riga del canale render_engine = github_completo e github_workflow = video_kao.yml.

on:
  workflow_dispatch:
    inputs:
      link_competitor:
        description: 'Link del video da copiare (lo passa n8n)'
        default: ''
        type: string
      prova:
        description: 'SI = crea il video ma NON lo carica su YouTube'
        default: 'NO'
        type: string
      carica:
        description: 'SI = carica su YouTube'
        default: 'SI'
        type: string
      voce:
        description: 'Voce ElevenLabs (la passa n8n)'
        default: ''
        type: string
      payload:
        description: 'Solo per n8n (riga del canale)'
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: video-kao-completo
  cancel-in-progress: false

jobs:
  turno:   # mai due video con Pexels nello stesso momento: se un altro e' gia' in lavorazione, questo si rimanda al prossimo turno
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ok: ${{ steps.t.outputs.ok }}
    steps:
      - name: Nascondi chiavi e token del payload (repository pubblico)
        run: |
          python3 - <<'PY'
          import json, os
          ev = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          raw = (ev.get('inputs') or {}).get('payload') or ''
          try:
              p = json.loads(raw)
          except Exception:
              p = {}
          for k, v in (p.items() if isinstance(p, dict) else []):
              if any(w in str(k).lower() for w in ('token', 'secret', 'password', 'api_key', 'apikey')) and len(str(v).strip()) > 8:
                  print('::add-mask::' + str(v).strip())
          PY
      - uses: actions/checkout@v4
        with:
          sparse-checkout: strumenti
      - id: t
        name: Turno Pexels
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ inputs.payload }}
          PROVA: ${{ inputs.prova }}
          WORKFLOW_PEXELS: video_storia.yml,video_kao.yml,video_agora.yml,video_produzione.yml,filosofo.yml,kao_render.yml
        run: python3 strumenti/turno_pexels.py

  video:
    needs: turno
    if: needs.turno.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Nascondi chiavi e token del payload (repository pubblico)
        run: |
          python3 - <<'PY'
          import json, os
          ev = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          raw = (ev.get('inputs') or {}).get('payload') or ''
          try:
              p = json.loads(raw)
          except Exception:
              p = {}
          for k, v in (p.items() if isinstance(p, dict) else []):
              if any(w in str(k).lower() for w in ('token', 'secret', 'password', 'api_key', 'apikey')) and len(str(v).strip()) > 8:
                  print('::add-mask::' + str(v).strip())
          PY
      - uses: actions/checkout@v4

      - name: Installa FFmpeg, font, whisper e Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core python3-pil
          pip install -q faster-whisper pillow playwright && python -m playwright install --with-deps chromium
          npm install --prefix kao --silent --no-audit --no-fund luxon@3
          node --version && ffmpeg -version | head -1

      - name: Crea e carica il video
        env:
          PAYLOAD: ${{ inputs.payload }}
          PROVA: ${{ inputs.prova }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_KAO }}
          WHISPER_MODEL: small
        run: node kao/motore.js

      - name: Video di prova (se non caricato)
        if: ${{ always() && inputs.prova == 'SI' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-kao
          path: lavoro_kao/video_finale.mp4
          if-no-files-found: ignore
          retention-days: 3
