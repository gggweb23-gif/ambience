name: Modifica Channel Configs (con lucchetti)

# Scrive celle di Channel Configs con l'account di servizio (coach/foglio_configs.py). Riga KAO, videos_per_day e publish_schedule_days bloccate.
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: modifiche [{canale, colonna, valore}], nuove_colonne [...], prova SI/NO  oppure  canale, link, valori {colonna: valore} (file di produzione)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  foglio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Nascondi chiavi e token del payload (repository pubblico)
        run: |
          python3 - <<'PY'
          import json, os
          ev = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          raw = (ev.get('inputs') or {}).get('payload') or ''
          try:
              p = json.loads(raw)
          except Exception:
              p = {}
          for k, v in (p.items() if isinstance(p, dict) else []):
              if any(w in str(k).lower() for w in ('token', 'secret', 'password', 'api_key', 'apikey')) and len(str(v).strip()) > 8:
                  print('::add-mask::' + str(v).strip())
          PY
      - uses: actions/checkout@v4
      - name: Modifica
        env:
          PAYLOAD: ${{ inputs.payload }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: pip install -q google-auth requests && python3 coach/$(python3 -c 'import json,os;print("foglio_produzione.py" if json.loads(os.environ["PAYLOAD"]).get("link") else "foglio_configs.py")')
      - name: Registro delle modifiche
        if: ${{ always() }}
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add coach/modifiche_foglio.log 2>/dev/null; git commit -m "Modifica Channel Configs" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done
