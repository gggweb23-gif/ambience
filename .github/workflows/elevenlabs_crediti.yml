name: Crediti ElevenLabs
# 18 nov 2026: legge quanti caratteri restano sul piano ElevenLabs (gratis, nessuna spesa). Stampa solo i numeri, mai la chiave.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crediti:
    runs-on: ubuntu-latest
    steps:
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          req = urllib.request.Request('https://api.elevenlabs.io/v1/user/subscription', headers={'xi-api-key': os.environ.get('ELEVENLABS_API_KEY', '')})
          try:
              s = json.loads(urllib.request.urlopen(req, timeout=60).read())
              print('PIANO', s.get('tier'), '| caratteri usati', s.get('character_count'), 'su', s.get('character_limit'),
                    '| restano', (s.get('character_limit') or 0) - (s.get('character_count') or 0), '| rinnovo (unix)', s.get('next_character_count_reset_unix'))
          except urllib.error.HTTPError as e:
              print('ERRORE', e.code, e.read().decode()[:300])
          PY
