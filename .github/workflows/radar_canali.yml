name: Radar canali (dati e immagini dei canali da copiare, gratis)

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: nome, canali [UC...], fotogrammi SI/NO'
        required: true
        type: string

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q pillow yt-dlp
      - name: Radar
        env:
          PAYLOAD: ${{ inputs.payload }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_ORBITAL_DAYS }}
        run: python3 strumenti/radar_canali.py
      - name: Salva nel repository
        if: ${{ always() }}
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add prove_video/radar; git commit -m "Radar canali" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done
