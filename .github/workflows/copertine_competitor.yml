name: Copertine Competitor

# Gratis: scarica titoli e copertine degli ultimi video di un canale YouTube (strumenti/copertine_competitor.py).
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON con nome e canale_id'
        required: true
        type: string

permissions:
  contents: write

jobs:
  copertine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Nascondi chiavi e token del payload (repository pubblico)
        run: |
          python3 - <<'PY'
          import json, os
          ev = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          raw = (ev.get('inputs') or {}).get('payload') or ''
          try:
              p = json.loads(raw)
          except Exception:
              p = {}
          for k, v in (p.items() if isinstance(p, dict) else []):
              if any(w in str(k).lower() for w in ('token', 'secret', 'password', 'api_key', 'apikey')) and len(str(v).strip()) > 8:
                  print('::add-mask::' + str(v).strip())
          PY
      - uses: actions/checkout@v4
      - name: Scarica copertine
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: pip install -q pillow && python3 strumenti/copertine_competitor.py
      - name: Salva nel repository
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain copertine_competitor)" ]; then
            git config user.name "render-bot"
            git config user.email "render-bot@users.noreply.github.com"
            git add copertine_competitor
            git commit -m "Copertine competitor"
            for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i * 5)); done
          fi
