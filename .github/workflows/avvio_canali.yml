name: Avvio canali (al posto dell'orchestratore n8n)

# Ogni ora di notte lancia il video del giorno dei canali con motore GitHub (strumenti/avvio_canali.py):
# github_workflow = video_produzione.yml (KAO, Agora...) oppure render_workflow = video_storia.yml / video_mappe.yml.
# Un video Pexels alla volta: i canali Pexels in attesa partono al giro successivo. I canali d'archivio restano su avvio_archivio.yml.
on:
  schedule:
    - cron: '7,37 23 * * *'   # 00:07 e 00:37 ora italiana (GitHub spesso parte con 30-70 minuti di ritardo)
    - cron: '7,37 0-4 * * *'  # ogni mezz'ora fino alle 05:37: giri successivi per i canali Pexels in attesa e per i video falliti
    # inoltre video_produzione.yml e video_storia.yml rilanciano questo avvio appena finiscono (turno Pexels senza attese)
  workflow_dispatch:
    inputs:
      canale:
        description: 'Solo questo canale (channel_id), vuoto = tutti'
        default: ''
        type: string
      anticipo:
        description: 'Video in anticipo: esce tra N giorni (vuoto = oggi)'
        default: ''
        type: string
      privacy:
        description: 'Vuoto = come da foglio; unlisted = NON IN ELENCO (lo pubblica Giorgio a mano)'
        default: ''
        type: string
      forza:
        description: 'SI = lancia anche se oggi il canale ha gia fatto un video o una prova'
        default: ''
        type: string
      rifai_riga:
        description: 'Con canale: rifa il video di questa riga del file di produzione (anche se gia fatta)'
        default: ''
        type: string
      copione_da:
        description: 'Con rifai_riga: file del copione da riusare (es. prove_video/Costo_Vero/copioni/x.json)'
        default: ''
        type: string
      escludi_run:
        description: 'Uso interno: id del video Pexels appena finito che ha lanciato questo avvio'
        default: ''
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: avvio-canali
  cancel-in-progress: false

jobs:
  avvio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Avvio
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 9 nov: controllo che il video sia del filone del canale
          GH_TOKEN: ${{ github.token }}
          SOLO_CANALE: ${{ inputs.canale }}
          ANTICIPO_GIORNI: ${{ inputs.anticipo }}
          ESCLUDI_RUN: ${{ inputs.escludi_run }}
          PRIVACY: ${{ inputs.privacy }}
          FORZA: ${{ inputs.forza }}
          RIFAI_RIGA: ${{ inputs.rifai_riga }}
          COPIONE_DA: ${{ inputs.copione_da }}
        run: pip install -q google-auth requests && python3 strumenti/avvio_canali.py
      - name: Video notizie del giorno (se GitHub non ha fatto partire il loro orario)
        # 17 nov: gli orari di notizie_giorno.yml non sono partiti; questo avvio (affidabile) dalle 05:07 italiane li lancia se oggi non sono ancora partiti.
        # Un doppio giro e' impossibile: notizie_giorno.yml segna notizie/fatti/<filone>_<data>.txt appena parte.
        if: ${{ always() && inputs.canale == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ora=$(TZ=Europe/Rome date +%H); oggi=$(TZ=Europe/Rome date +%F)
          if [ "$ora" -lt 4 ] || [ "$ora" -gt 11 ]; then echo "fuori orario ($ora)"; exit 0; fi
          git pull -q || true
          for f in tech guerra; do
            attivi=$(python3 -c "import json;c=json.load(open('notizie/canali.json'));print(sum(1 for k,v in c.items() if k.startswith('$f'+'_') and isinstance(v,dict) and v.get('attivo')=='SI'))")
            if [ "$attivi" = "0" ]; then echo "$f: nessun canale attivo"; continue; fi
            if [ -f "notizie/fatti/${f}_${oggi}.txt" ]; then echo "$f: gia partito oggi"; continue; fi
            ogni=$(python3 -c "import json;print(json.load(open('notizie/canali.json')).get('_ogni_quanti_giorni',{}).get('$f',1))")
            if [ "$ogni" -gt 1 ] && [ $(( $(TZ=Europe/Rome date +%s) / 86400 % ogni )) -ne 0 ]; then echo "$f: oggi niente video (uno ogni $ogni giorni)"; continue; fi
            in_corso=$(gh run list -R "$GITHUB_REPOSITORY" -w notizie_giorno.yml -L 10 --json status,displayTitle -q "[.[]|select(.status!=\"completed\" and (.displayTitle|test(\"Notizie $f\")))]|length")
            if [ "$in_corso" != "0" ]; then echo "$f: giro gia in corso"; continue; fi
            echo "{\"ref\":\"main\",\"inputs\":{\"filone\":\"$f\",\"da_canali\":\"SI\"}}" > /tmp/n.json
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/notizie_giorno.yml/dispatches" --input /tmp/n.json && echo "$f: lanciato"
          done
