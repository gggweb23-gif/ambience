name: Avvio canali (al posto dell'orchestratore n8n)

# Ogni ora di notte lancia il video del giorno dei canali con motore GitHub (strumenti/avvio_canali.py):
# github_workflow = video_produzione.yml (KAO, Agora...) oppure render_workflow = video_storia.yml / video_mappe.yml.
# Un video Pexels alla volta: i canali Pexels in attesa partono al giro successivo. I canali d'archivio restano su avvio_archivio.yml.
on:
  schedule:
    - cron: '7,37 23 * * *'   # 00:07 e 00:37 ora italiana (GitHub spesso parte con 30-70 minuti di ritardo)
    - cron: '7,37 0-4 * * *'  # ogni mezz'ora fino alle 05:37: giri successivi per i canali Pexels in attesa e per i video falliti
    # inoltre video_produzione.yml e video_storia.yml rilanciano questo avvio appena finiscono (turno Pexels senza attese)
  workflow_dispatch:
    inputs:
      canale:
        description: 'Solo questo canale (channel_id), vuoto = tutti'
        default: ''
        type: string
      anticipo:
        description: 'Video in anticipo: esce tra N giorni (vuoto = oggi)'
        default: ''
        type: string
      escludi_run:
        description: 'Uso interno: id del video Pexels appena finito che ha lanciato questo avvio'
        default: ''
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: avvio-canali
  cancel-in-progress: false

jobs:
  avvio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Avvio
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GH_TOKEN: ${{ github.token }}
          SOLO_CANALE: ${{ inputs.canale }}
          ANTICIPO_GIORNI: ${{ inputs.anticipo }}
          ESCLUDI_RUN: ${{ inputs.escludi_run }}
        run: pip install -q google-auth requests && python3 strumenti/avvio_canali.py
