name: Video Archivio (video vero da archivi gratuiti)
run-name: Video Archivio ${{ fromJSON(inputs.payload).channel_id }}   # avvio_archivio.py conta i tentativi del giorno per canale

# Video completo per i canali fatti con archivi gratuiti (strumenti/video_archivio.py): copione, montaggio, controlli, copertina, caricamento.
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Riga di Channel Configs + titolo, testo_copertina, link_competitor, nome'
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:   # un video alla volta PER CANALE: canali diversi lavorano in parallelo (prima erano in fila e l'ultimo finiva dopo le 7)
  group: archivio-${{ fromJSON(inputs.payload).channel_id || 'prova' }}
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # montaggio + riparazione possono superare le 4 ore (WWII 05/11 fermato a 240)
    steps:
      - name: Nascondi chiavi e token del payload (repository pubblico)
        run: "python3 - <<'PY'\nimport json, os\nev = json.load(open(os.environ['GITHUB_EVENT_PATH']))\nraw = (ev.get('inputs') or {}).get('payload') or (ev.get('inputs') or {}).get('config') or ''\ntry:\n    p = json.loads(raw)\nexcept Exception:\n    p = {}\nfor k, v in (p.items() if isinstance(p, dict) else []):\n    if any(w in str(k).lower() for w in ('token', 'secret', 'password', 'api_key', 'apikey')) and len(str(v).strip()) > 8:\n        print('::add-mask::' + str(v).strip())\nPY"
      - uses: actions/checkout@v4
      - name: Strumenti
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q pillow google-auth requests json-repair
      - name: Recupera copione e voce di un giro fallito (stesso canale; si riusano solo se il titolo e' lo stesso)
        id: rid
        env:
          PAYLOAD: ${{ inputs.payload }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(python3 -c "import json,os,re;p=json.loads(os.environ.get('PAYLOAD') or '{}');print(re.sub(r'[^a-z0-9]+','_',str(p.get('channel_id') or p.get('channel_name') or '').lower()).strip('_'))")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          [ -n "$ID" ] || exit 0
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=lavoro-archivio-$ID&per_page=10" --jq '[.artifacts[] | select(.expired==false)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$AID" ]; then echo "nessun lavoro salvato: si parte da zero"; exit 0; fi
          mkdir -p lavoro_archivio
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > lavoro.zip && unzip -o -q lavoro.zip -d lavoro_archivio && rm lavoro.zip
          echo "ripreso=SI" >> "$GITHUB_OUTPUT"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID" || true   # si usa una volta sola: se anche questo giro si ferma, il prossimo riparte da zero
          echo "lavoro salvato trovato:"; ls -la lavoro_archivio
      - name: Video
        env:
          PAYLOAD: ${{ inputs.payload }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets[fromJSON(inputs.payload).chiave_youtube] }}
        run: |
          set -o pipefail
          mkdir -p prove_video/archivio/registri
          python3 strumenti/video_archivio.py 2>&1 | tee "prove_video/archivio/registri/video_archivio_${{ steps.rid.outputs.id || 'prova' }}.log"   # un registro per canale: i canali ora girano in parallelo
      - name: Salva copione e voce per ripartire senza ripagarli (solo se il giro non e' finito bene)
        if: ${{ (failure() || cancelled()) && steps.rid.outputs.id != '' }}   # anche se si era ripreso un lavoro vecchio (titolo diverso): la voce nuova non va persa
        run: |
          mkdir -p lavoro_archivio; cp /tmp/lav/voce_*.json lavoro_archivio/ 2>/dev/null || true; ls -la lavoro_archivio
      - name: Carica il lavoro salvato
        if: ${{ (failure() || cancelled()) && steps.rid.outputs.id != '' }}   # anche se si era ripreso un lavoro vecchio (titolo diverso): la voce nuova non va persa
        uses: actions/upload-artifact@v4
        with:
          name: lavoro-archivio-${{ steps.rid.outputs.id }}
          path: lavoro_archivio/
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true
      - name: Video riuscito, cancella il lavoro salvato
        if: ${{ success() && steps.rid.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for A in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=lavoro-archivio-${{ steps.rid.outputs.id }}&per_page=20" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$A" && echo "cancellato lavoro $A"
          done
      - name: Video e copertina da scaricare
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: video-archivio
          path: |
            prove_video/archivio/*/prova.mp4
            prove_video/archivio/*/copertina.jpg
          if-no-files-found: ignore
          retention-days: 7
      - name: Salva nel repository (senza il video)
        if: ${{ always() }}
        run: |
          find prove_video/archivio -name 'prova.mp4*' -size +40M -delete || true   # anche prova.mp4.migliore.mp4 (oltre 100 MB GitHub rifiuta il salvataggio)
          if [ -n "$(git status --porcelain prove_video/archivio coach/costi)" ]; then
            git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
            git add prove_video/archivio coach/costi libreria_clip/*/ricerche_mancanti.txt libreria_clip/*/bocciati.json 2>/dev/null || git add prove_video/archivio coach/costi; git commit -m "Video archivio"
            for i in 1 2 3 4 5; do (git pull --rebase -q || { git rebase --abort; git pull --rebase -q -X theirs; }) && git push && break; sleep $((i * 5)); done
          fi
