name: Video notizie (prova)
run-name: Notizia ${{ inputs.notizia }}

# Motore notizie (video_notizie.py, 16 nov 2026): copione da fonti verificate in notizie/<nome>.json -> video 2560x1440 con caricature vere,
# sfondi a cartone, clip Pexels, grafica animata. Risultato in prove_video/notizie/<nome>/ (non carica su YouTube).
on:
  workflow_dispatch:
    inputs:
      notizia: {description: 'file della notizia, es. notizie/revolut_commissariata.json', required: true, type: string}
      tetto: {description: 'tetto di spesa in dollari per questo video', default: '0.70', type: string}

concurrency:
  group: notizie-${{ inputs.notizia }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - name: Programmi
        run: pip install --quiet --break-system-packages pillow
      - name: Video
        env:
          NOTIZIA: ${{ inputs.notizia }}
          TETTO_DOLLARI: ${{ inputs.tetto }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 video_notizie.py
      - name: Salva nel repository
        if: ${{ always() }}
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add prove_video/notizie caricature 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -qm "Prova notizia ${{ inputs.notizia }}"
            for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i * 5)); done
          fi
