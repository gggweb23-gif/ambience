name: Video in anticipo (a mano)

# 6 nov 2026 (Giorgio): video gia' pronti per i giorni successivi. I video Pexels (Storia, Agora) vanno uno alla volta,
# Mappe e archivio in parallelo. La notte non si rifa' un video per un giorno che ne ha gia' uno (avvio: "gia' pronto").
on:
  workflow_dispatch:
    inputs:   # 7 nov: corsie vuote = non fanno niente (prima un valore vuoto prendeva i video di prova e lanciava video non richiesti)
      pexels:
        description: 'Corsia Pexels, es. avvio_canali.yml|Storia in Minuti|1|Video Storia (spazio tra le voci launcher|canale|giorni|etichetta)'
        default: ''
      mappe:
        default: ''
      archivio1:
        default: ''
      archivio2:
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  corsia:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        quale: [pexels, mappe, archivio1, archivio2]
    steps:
      - uses: actions/checkout@v4
      - name: Video uno dopo l'altro
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          VOCI: ${{ github.event.inputs[matrix.quale] }}
        run: |
          # le voci sono separate da " avvio_" (i nomi dei canali hanno spazi)
          python3 - <<'PY' > voci.txt
          import os, re
          print('\n'.join(re.split(r' (?=avvio_)', os.environ['VOCI'].strip())))
          PY
          mapfile -t V < voci.txt
          bash strumenti/anticipo.sh "${V[@]}"
