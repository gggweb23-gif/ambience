name: Prova Archivio (video breve da archivi gratuiti)

# Prima di aprire un canale: video di prova fatto solo con archivi gratuiti (strumenti/prova_archivio.py).
# Spesa: solo i crediti voce ElevenLabs dell'abbonamento (copione gia' scritto, immagini gratis, render gratis).
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON con nome, voce, scene (vedi strumenti/prova_archivio.py)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: prova-archivio
  cancel-in-progress: false

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q pillow
      - name: Video di prova
        env:
          PAYLOAD: ${{ inputs.payload }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 strumenti/prova_archivio.py
      - name: Salva nel repository
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain prove_video/archivio)" ]; then
            git config user.name "render-bot"
            git config user.email "render-bot@users.noreply.github.com"
            git add prove_video/archivio
            git commit -m "Prova archivio"
            for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i * 5)); done
          fi
