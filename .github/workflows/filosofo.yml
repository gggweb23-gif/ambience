name: Video Filosofo

# Avviato da PRODUCTION (canali con render_engine = github, es. Agora of Sages).
# Riceve: payload = {"id": "...", "dati_url": "...", "resume_url": "..."}
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON preparato da n8n'
        required: true
        type: string
      prova:
        description: 'SI = crea il video ma non lo carica (resta negli artifact)'
        required: false
        default: 'NO'
        type: string

permissions:
  contents: write

jobs:
  turno:   # mai due video con Pexels nello stesso momento: se un altro e' gia' in lavorazione, questo si rimanda al prossimo turno
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ok: ${{ steps.t.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: strumenti
      - id: t
        name: Turno Pexels
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ inputs.payload }}
          PROVA: ${{ inputs.prova }}
          WORKFLOW_PEXELS: video_storia.yml,video_kao.yml,video_agora.yml,video_produzione.yml,filosofo.yml,kao_render.yml
        run: python3 strumenti/turno_pexels.py

  render:
    needs: turno
    if: needs.turno.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - name: Installa FFmpeg e font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core python3-fonttools python3-pil
          mkdir -p font
          if [ ! -f font/CormorantGaramond-SemiBold.ttf ]; then
            npm pack @fontsource/cormorant-garamond@5.3.0 --silent
            tar xzf fontsource-cormorant-garamond-5.3.0.tgz
            python3 -c "from fontTools.ttLib import TTFont; f=TTFont('package/files/cormorant-garamond-latin-600-normal.woff'); f.flavor=None; f.save('font/CormorantGaramond-SemiBold.ttf')"
          fi
          fc-scan --format "%{family}\n" font/CormorantGaramond-SemiBold.ttf
          # trascrizione parola per parola (sottotitoli a frasi dello stile Agora)
          pip install -q --break-system-packages faster-whisper || pip install -q faster-whisper || echo "faster-whisper non installato: tempi stimati"

      - name: Crea il video
        env:
          PAYLOAD: ${{ inputs.payload }}
          DRY_RUN: ${{ inputs.prova == 'SI' && '1' || '0' }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHISPER_MODEL: small
        run: python3 render_filosofo.py

      - name: Salva i nuovi ritratti e lo storico immagini nel repository
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain ritratti libreria_agora 2>/dev/null)" ]; then
            git config user.name "render-bot"
            git config user.email "render-bot@users.noreply.github.com"
            git add ritratti libreria_agora 2>/dev/null || git add ritratti
            git commit -m "Nuovo ritratto filosofo"
            git pull --rebase -q || true
            git push || echo "ritratto non salvato (verra' ricreato la prossima volta)"
          fi

      - name: Salva il video di prova
        if: ${{ inputs.prova == 'SI' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-filosofo
          path: lavoro_filosofo/video_finale.mp4
          retention-days: 3
