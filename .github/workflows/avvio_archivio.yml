name: Avvio giornaliero canali archivio

# Ogni giorno lancia il video del giorno per i canali con render_workflow = video_archivio.yml e videos_per_day >= 1 (strumenti/avvio_archivio.py).
on:
  schedule:
    - cron: '41 0 * * *'   # 01:41 ora italiana (dopo la libreria delle 00:23): video pronto di notte, esce alle 17 (publish_time)
  workflow_dispatch:
    inputs:
      canale:
        description: 'Solo questo canale (channel_id), vuoto = tutti'
        default: ''
        type: string
      privacy:
        description: 'Privacy forzata (es. unlisted), vuoto = quella del foglio'
        default: ''
        type: string

permissions:
  contents: read
  actions: write

jobs:
  avvio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Avvio
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GH_TOKEN: ${{ github.token }}
          SOLO_CANALE: ${{ inputs.canale }}
          PRIVACY_FORZATA: ${{ inputs.privacy }}
        run: pip install -q google-auth requests && python3 strumenti/avvio_archivio.py
