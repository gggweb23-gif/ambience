name: Copertina archivio (rifai solo la copertina)

# 8 nov: Orbital Days / WWII Testimony - rifa' la copertina di un video gia' fatto, dal file del video (artifact shorts-<canale>-riga<N>)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID del run di Video archivio che ha fatto il video'
        required: true
      artifact:
        description: 'Nome dell artifact con il video (es. shorts-Orbital Days-riga12)'
        required: true
      payload:
        description: 'JSON: nome, titolo, testo_copertina, copertina_stile, copertina_soggetto, copertina_variante'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  copertina:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scarica il video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          gh run download "${{ inputs.run_id }}" -n "${{ inputs.artifact }}" -D sorgente -R "$GITHUB_REPOSITORY"
          ls -la sorgente
      - name: Copertina
        env:
          PAYLOAD: ${{ inputs.payload }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -q pillow json-repair
          export VIDEO="$(ls sorgente/*.mp4 | head -1)"
          python3 strumenti/copertina_archivio.py
      - name: Salva
        run: |
          git config user.name render-bot && git config user.email render-bot@users.noreply.github.com
          git add prove_video/archivio_copertine && git commit -m 'Copertina archivio' && (for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done) || echo niente da salvare
