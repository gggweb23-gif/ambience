name: Prova Gloam
# 9 nov: prova da 1 minuto nello stile Gloam (scene 3D + voce inglese). Non carica niente su YouTube.
on:
  workflow_dispatch:
    inputs:
      tema:
        description: 'Argomento (inglese)'
        default: ''
        type: string

permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Programmi
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q --break-system-packages pillow json-repair
          curl -sSL -o Anton-Regular.ttf https://cdn.jsdelivr.net/gh/google/fonts/ofl/anton/Anton-Regular.ttf
      - name: Video di prova
        env:
          TEMA: ${{ inputs.tema }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python3 strumenti/prova_gloam.py
      - name: Salva nel repository
        if: ${{ always() }}
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add prove_video/Prova_Gloam; git commit -m "Prova Gloam" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done
