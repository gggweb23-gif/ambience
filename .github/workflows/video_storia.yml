name: Video Storia

on:
  workflow_dispatch:
    inputs:
      link_competitor:
        description: 'Link del video da copiare (OBBLIGATORIO: senza link il video non parte)'
        required: true
        default: ''
        type: string
      titolo:
        description: 'Titolo di riserva (si usa solo se manca il link)'
        default: "Tutta la storia dell'Iran"
        type: string
      minuti:
        description: 'Durata in minuti'
        default: '13'
        type: string
      max_minuti:
        description: 'Durata massima in minuti (oltre, il testo viene condensato)'
        default: '25'
        type: string
      prova:
        description: 'SI = video corto di prova (~1 minuto)'
        default: 'NO'
        type: string
      voce:
        description: 'Voce ElevenLabs (ID)'
        default: 'glnsgBC77wt5zOYU0szz'
        type: string
      musica_url:
        description: 'Link musica di sottofondo (facoltativo)'
        default: ''
        type: string
      carica:
        description: 'SI = carica il video su YouTube (canale Storia in Minuti)'
        default: 'NO'
        type: string
      payload:
        description: 'Solo per n8n (lascia vuoto)'
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: storia-${{ fromJSON(inputs.payload || '{}').canale || 'storia' }}   # un video alla volta PER CANALE
  cancel-in-progress: false

jobs:
  turno:   # mai due video con Pexels nello stesso momento: se un altro e' gia' in lavorazione, questo si rimanda al prossimo turno
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ok: ${{ steps.t.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: strumenti
      - id: t
        name: Turno Pexels
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ inputs.payload }}
          PROVA: ${{ inputs.prova }}
          WORKFLOW_PEXELS: video_storia.yml,video_kao.yml,video_agora.yml,video_produzione.yml,filosofo.yml,kao_render.yml
        run: python3 strumenti/turno_pexels.py

  video:
    needs: turno
    if: needs.turno.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Programmi, caratteri e mappe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil python3-numpy python3-fonttools
          pip install --quiet --break-system-packages youtube-transcript-api
          mkdir -p font geo tmp_npm && cd tmp_npm
          npm init -y > /dev/null
          npm i --silent world-atlas@2.0.2 topojson-client@3.1.0 @fontsource/eb-garamond@5.2.5 @fontsource/luckiest-guy@5.2.5 @fontsource/special-elite@5.2.5 @fontsource/unifrakturmaguntia@5.2.5 @fontsource/cinzel@5.2.5 @fontsource/im-fell-english@5.2.5 @fontsource/playfair-display@5.2.5 @fontsource/oswald@5.2.5
          node -e "const fs=require('fs'),t=require('topojson-client');const a=require('world-atlas/countries-110m.json'),b=require('world-atlas/countries-50m.json');fs.writeFileSync('../geo/mondo.json',JSON.stringify(t.feature(a,a.objects.countries)));fs.writeFileSync('../geo/dettaglio.json',JSON.stringify(t.feature(b,b.objects.countries)));"
          python3 -c "
          from fontTools.ttLib import TTFont
          m={'eb-garamond/files/eb-garamond-latin-600-normal.woff':'EBGaramond-SemiBold.ttf','luckiest-guy/files/luckiest-guy-latin-400-normal.woff':'LuckiestGuy.ttf',
             'special-elite/files/special-elite-latin-400-normal.woff':'SpecialElite.ttf','unifrakturmaguntia/files/unifrakturmaguntia-latin-400-normal.woff':'UnifrakturMaguntia.ttf',
             'cinzel/files/cinzel-latin-700-normal.woff':'Cinzel-Bold.ttf','im-fell-english/files/im-fell-english-latin-400-normal.woff':'IMFellEnglish.ttf',
             'playfair-display/files/playfair-display-latin-700-normal.woff':'PlayfairDisplay-Bold.ttf','oswald/files/oswald-latin-600-normal.woff':'Oswald-SemiBold.ttf'}
          for s,d in m.items():
              f=TTFont('node_modules/@fontsource/'+s); f.flavor=None; f.save('../font/'+d)
          "
          ls ../font ../geo

      - name: Recupera il lavoro di un giro fallito (stesso video)
        id: rid
        env:
          PAYLOAD: ${{ inputs.payload }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(python3 -c "import json,os,re;p=json.loads(os.environ.get('PAYLOAD') or '{}');print(re.sub(r'[^A-Za-z0-9_-]','',str(p.get('id') or '')))")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          if [ -z "$ID" ]; then echo "giro a mano: nessuna ripresa"; exit 0; fi
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=lavoro-storia-$ID&per_page=10" --jq '[.artifacts[] | select(.expired==false)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$AID" ]; then echo "nessun lavoro salvato per $ID: si parte da zero"; exit 0; fi
          mkdir -p lavoro_storia
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > lavoro.zip && unzip -o -q lavoro.zip -d lavoro_storia && rm lavoro.zip
          echo "RIPRESA di $ID:"; ls lavoro_storia | head -100

      - name: Crea il video
        timeout-minutes: 270   # i video a cartone lunghi (390 scene) superano le 2 ore: con 135 venivano fermati a un passo dalla fine
        env:
          LINK_COMPETITOR: ${{ inputs.link_competitor }}
          TITOLO: ${{ inputs.titolo }}
          MINUTI: ${{ inputs.minuti }}
          MAX_MINUTI: ${{ inputs.max_minuti }}
          PROVA: ${{ inputs.prova }}
          VOCE: ${{ inputs.voce }}
          MUSICA_URL: ${{ inputs.musica_url }}
          LINGUA: it
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          CARICA: ${{ inputs.carica }}
          PAYLOAD: ${{ inputs.payload }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets[fromJSON(inputs.payload || '{}').chiave_youtube || 'YT_REFRESH_TOKEN_STORIA'] }}   # chiave_youtube del canale (vuota = Storia in Minuti)
        shell: bash
        run: |
          set -o pipefail
          python3 video_storia.py 2>&1 | tee storia.log

      - name: Costo del video (storico per il coach automatico)
        if: ${{ success() }}
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          python3 coach/registra_costo.py lavoro_storia/costi_video.jsonl || exit 0
          [ -n "$(git status --porcelain coach/costi)" ] || exit 0
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add coach/costi; git commit -m "Costo video" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done

      - name: Salva il lavoro per ripartire (solo se il giro non e' finito bene)
        if: ${{ (failure() || cancelled()) && steps.rid.outputs.id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lavoro-storia-${{ steps.rid.outputs.id }}
          path: |
            lavoro_storia/copione_lavoro.json
            lavoro_storia/voce_*.mp3
            lavoro_storia/voce_*.json
            lavoro_storia/sfondo_s*.jpg
            lavoro_storia/cornice.png
            lavoro_storia/cornice.png.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Video riuscito, cancella il lavoro salvato
        if: ${{ success() && steps.rid.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for A in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=lavoro-storia-${{ steps.rid.outputs.id }}&per_page=20" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$A" && echo "cancellato lavoro $A"
          done

      - name: Salva il risultato
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: video-storia
          path: |
            video_storia.mp4
            copertina.jpg
            copertina_2.jpg
            titolo.txt
            copione.json
            personaggi_mancanti.txt
            copertina_analisi.txt
          retention-days: 7

      - name: Libreria musicale comune (brani nuovi creati da questo video)
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain libreria_musica libreria_suoni 2>/dev/null)" ]; then
            git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
            for P in libreria_musica libreria_suoni; do [ -e "$P" ] && git add "$P"; done; git commit -m "Libreria musicale e suoni" || exit 0
            for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done
          fi

      - name: Anteprima della prova nel repository (copertina + 8 fotogrammi, per controllarla senza scaricare il video)
        if: ${{ always() }}   # anche per i video veri: copertina, fotogrammi e registro per controllarli senza scaricare
        run: |
          D="prove_video/$(python3 -c "import json,os,re;p=json.loads(os.environ.get('PAYLOAD') or '{}');print(re.sub(r'[^A-Za-z0-9_-]','_',str(p.get('canale') or 'storia')))")"
          mkdir -p "$D" && find "$D" -maxdepth 1 -type f -delete
          [ -f copertina.jpg ] && cp copertina.jpg "$D/"
          [ -f titolo.txt ] && cp titolo.txt "$D/"
          [ -f copione.json ] && cp copione.json "$D/"
          [ -f storia.log ] && grep -v -i -E "key|token|secret|authorization" storia.log | tail -n 300 > "$D/log.txt"
          if [ -f video_storia.mp4 ]; then
            DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 video_storia.mp4)
            for i in 1 2 3 4 5 6 7 8; do T=$(python3 -c "print(round($DUR*($i-0.5)/8,2))"); ffmpeg -v error -y -ss $T -i video_storia.mp4 -frames:v 1 -vf scale=960:-1 "$D/fotogramma_$i.jpg"; done
          fi
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add "$D"; git commit -m "Anteprima prova video" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done
        env:
          PAYLOAD: ${{ inputs.payload }}
