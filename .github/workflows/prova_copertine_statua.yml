name: Prove copertina statua (solo copertine)

# strumenti/prova_copertine_statua.py: varianti della copertina "statua" (Agora of Sages), niente video e niente YouTube. ~0,09 $ a copertina.
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: cartella, prove [{nome, titolo, config}]'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Programmi
        run: pip install -q --break-system-packages pillow
      - name: Prove
        env:
          PAYLOAD: ${{ inputs.payload }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python3 strumenti/prova_copertine_statua.py && (python3 costi.py costi_prove.jsonl || true)
      - name: Salva nel repository
        if: ${{ always() }}
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add prove_video; git commit -m "Prove copertina statua" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done
