{"name": "Video KAO", "on": {"workflow_dispatch": {"inputs": {"payload": {"description": "JSON preparato da n8n", "required": true, "type": "string"}, "prova": {"description": "SI = crea il video ma non lo carica (resta negli artifact)", "required": false, "default": "NO", "type": "string"}}}}, "permissions": {"contents": "read"}, "concurrency": {"group": "video-kao", "cancel-in-progress": false}, "jobs": {"turno": {"runs-on": "ubuntu-latest", "timeout-minutes": 5, "permissions": {"actions": "read", "contents": "read"}, "outputs": {"ok": "${{ steps.t.outputs.ok }}"}, "steps": [{"name": "Nascondi chiavi e token del payload (repository pubblico)", "run": "python3 - <<'PY'\nimport json, os\nev = json.load(open(os.environ['GITHUB_EVENT_PATH']))\nraw = (ev.get('inputs') or {}).get('payload') or ''\ntry:\n    p = json.loads(raw)\nexcept Exception:\n    p = {}\nfor k, v in (p.items() if isinstance(p, dict) else []):\n    if any(w in str(k).lower() for w in ('token', 'secret', 'password', 'api_key', 'apikey')) and len(str(v).strip()) > 8:\n        print('::add-mask::' + str(v).strip())\nPY"}, {"uses": "actions/checkout@v4", "with": {"sparse-checkout": "strumenti"}}, {"id": "t", "name": "Turno Pexels", "env": {"GH_TOKEN": "${{ github.token }}", "PAYLOAD": "${{ inputs.payload }}", "PROVA": "${{ inputs.prova }}", "WORKFLOW_PEXELS": "video_storia.yml,video_kao.yml,video_agora.yml,video_produzione.yml,filosofo.yml,kao_render.yml"}, "run": "python3 strumenti/turno_pexels.py"}]}, "render": {"runs-on": "ubuntu-latest", "timeout-minutes": 170, "steps": [{"name": "Nascondi chiavi e token del payload (repository pubblico)", "run": "python3 - <<'PY'\nimport json, os\nev = json.load(open(os.environ['GITHUB_EVENT_PATH']))\nraw = (ev.get('inputs') or {}).get('payload') or ''\ntry:\n    p = json.loads(raw)\nexcept Exception:\n    p = {}\nfor k, v in (p.items() if isinstance(p, dict) else []):\n    if any(w in str(k).lower() for w in ('token', 'secret', 'password', 'api_key', 'apikey')) and len(str(v).strip()) > 8:\n        print('::add-mask::' + str(v).strip())\nPY"}, {"uses": "actions/checkout@v4"}, {"name": "Installa FFmpeg, font e whisper", "run": "sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core python3-pil &&      pip install -q faster-whisper pillow playwright && python -m playwright install --with-deps chromium"}, {"name": "Crea il video", "env": {"PAYLOAD": "${{ inputs.payload }}", "DRY_RUN": "${{ inputs.prova == 'SI' && '1' || '0' }}", "PEXELS_API_KEY": "${{ secrets.PEXELS_API_KEY }}", "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}", "FAL_KEY": "${{ secrets.FAL_KEY }}", "LINGUA": "it", "WHISPER_MODEL": "small"}, "run": "python3 render_kao.py"}, {"name": "Salva il video di prova", "if": "${{ inputs.prova == 'SI' }}", "uses": "actions/upload-artifact@v4", "with": {"name": "video-kao", "path": "lavoro_kao/video_finale.mp4", "retention-days": 3}}], "needs": "turno", "if": "needs.turno.outputs.ok == 'true'"}}}