{"name": "Video KAO", "on": {"workflow_dispatch": {"inputs": {"payload": {"description": "JSON preparato da n8n", "required": true, "type": "string"}, "prova": {"description": "SI = crea il video ma non lo carica (resta negli artifact)", "required": false, "default": "NO", "type": "string"}}}}, "permissions": {"contents": "read"}, "concurrency": {"group": "video-kao", "cancel-in-progress": false}, "jobs": {"render": {"runs-on": "ubuntu-latest", "timeout-minutes": 90, "steps": [{"uses": "actions/checkout@v4"}, {"name": "Installa FFmpeg, font e whisper", "run": "sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core python3-pil &&      pip install -q faster-whisper pillow playwright && python -m playwright install --with-deps chromium"}, {"name": "Crea il video", "env": {"PAYLOAD": "${{ inputs.payload }}", "DRY_RUN": "${{ inputs.prova == 'SI' && '1' || '0' }}", "PEXELS_API_KEY": "${{ secrets.PEXELS_API_KEY }}", "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}", "FAL_KEY": "${{ secrets.FAL_KEY }}", "LINGUA": "it", "WHISPER_MODEL": "small"}, "run": "python3 render_kao.py"}, {"name": "Salva il video di prova", "if": "${{ inputs.prova == 'SI' }}", "uses": "actions/upload-artifact@v4", "with": {"name": "video-kao", "path": "lavoro_kao/video_finale.mp4", "retention-days": 3}}]}}}
