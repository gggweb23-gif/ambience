name: Prova voci (risparmio)
# 18 nov 2026: 1 minuto di voce notizie con ElevenLabs Flash v2.5 e con MiniMax su fal, per scegliere la voce piu' economica. Spesa: pochi centesimi.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python3 strumenti/prova_voci.py
      - run: |
          git config user.name render-bot; git config user.email render-bot@users.noreply.github.com
          git add prove_voci && git commit -qm "Prova voci" && (git pull --rebase -q || { git rebase --abort; git pull --rebase -q -X theirs; }) && git push -q || true
