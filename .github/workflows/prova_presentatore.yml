name: Prova Presentatore

# Prova copertine con un "presentatore" credibile (volto realistico) incollato su una nostra copertina (strumenti/prova_presentatore.py).
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON con nome, video_id, competitor_id, persone, posizioni, max_spesa'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Nascondi chiavi e token del payload (repository pubblico)
        run: |
          python3 - <<'PY'
          import json, os
          ev = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          raw = (ev.get('inputs') or {}).get('payload') or ''
          try:
              p = json.loads(raw)
          except Exception:
              p = {}
          for k, v in (p.items() if isinstance(p, dict) else []):
              if any(w in str(k).lower() for w in ('token', 'secret', 'password', 'api_key', 'apikey')) and len(str(v).strip()) > 8:
                  print('::add-mask::' + str(v).strip())
          PY
      - uses: actions/checkout@v4
      - name: Presentatore in copertina
        env:
          PAYLOAD: ${{ inputs.payload }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: pip install -q pillow "rembg[cpu]" && python3 strumenti/prova_presentatore.py
      - name: Salva nel repository
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain prove_presentatore)" ]; then
            git config user.name "render-bot"
            git config user.email "render-bot@users.noreply.github.com"
            git add prove_presentatore
            git commit -m "Prova presentatore"
            for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i * 5)); done
          fi
      - name: Copia di riserva (se il salvataggio non riesce)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: risultati
          path: prove_presentatore
          if-no-files-found: ignore
          retention-days: 7
