name: Trova i video caricati a mano

# Gratis (solo lettura su YouTube): le righe "Da caricare a mano" diventano Completato con youtube_video_id appena Giorgio carica il video
# (strumenti/trova_caricati.py). Ogni ora dalle 8 alle 22 circa (ora italiana); si puo' lanciare anche a mano.
on:
  schedule:
    - cron: '13 6-20 * * *'
  workflow_dispatch:
    inputs:
      ripristina:
        description: 'Solo correzioni: JSON {"canale": riga}'
        default: ''

permissions:
  contents: read

concurrency:
  group: trova-caricati

jobs:
  trova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Trova
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          YT_REFRESH_TOKEN_AGORA_OF_SAGES: ${{ secrets.YT_REFRESH_TOKEN_AGORA_OF_SAGES }}
          YT_REFRESH_TOKEN_MAIN_STREET_ATLAS: ${{ secrets.YT_REFRESH_TOKEN_MAIN_STREET_ATLAS }}
          YT_REFRESH_TOKEN_STORIA: ${{ secrets.YT_REFRESH_TOKEN_STORIA }}
          YT_REFRESH_TOKEN_ORBITAL_DAYS: ${{ secrets.YT_REFRESH_TOKEN_ORBITAL_DAYS }}
          YT_REFRESH_TOKEN_WWII_TESTIMONY: ${{ secrets.YT_REFRESH_TOKEN_WWII_TESTIMONY }}
          YT_REFRESH_TOKEN_FACES_OF_ROME: ${{ secrets.YT_REFRESH_TOKEN_FACES_OF_ROME }}   # 7 nov: canale YouTube ex Faces of Rome, ora Quanto Ti Resta
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          RIPRISTINA: ${{ inputs.ripristina }}
        run: pip install -q google-auth requests && python3 strumenti/trova_caricati.py
