name: Voce per scene (prove video fatte in codice)

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: canale (channel_name) o voce, cartella, scene [..], modello, velocita'
        default: '{}'
        type: string

permissions:
  contents: write

jobs:
  voce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Voce
        env:
          PAYLOAD: ${{ inputs.payload }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: pip install -q google-auth requests && python3 strumenti/voce_scene.py
      - name: Salva nel repository
        if: ${{ always() }}
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add prove_video/voce_scene; git commit -m "Voce per scene" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done
