{"name": "Prova KAO Piatto", "on": {"workflow_dispatch": {"inputs": {"ultimi": {"description": "Quanti ultimi video provare (una copertina ciascuno)", "default": "8"}}}}, "permissions": {"contents": "read"}, "jobs": {"prova": {"runs-on": "ubuntu-latest", "timeout-minutes": 60, "steps": [{"uses": "actions/checkout@v4"}, {"name": "Copertine di prova (KAO originale, copia 100% competitor, niente caricamento)", "env": {"APPLICA": "NO", "STILE": "piatto", "RIFAI": "SI", "ULTIMI": "${{ inputs.ultimi }}", "MAX_VIDEO": "60", "COACH": "NO", "COPERTINE_CSV": "${{ secrets.COPERTINE_CSV_KAO }}", "YT_CLIENT_ID": "${{ secrets.YT_CLIENT_ID }}", "YT_CLIENT_SECRET": "${{ secrets.YT_CLIENT_SECRET }}", "YT_REFRESH_TOKEN": "${{ secrets.YT_REFRESH_TOKEN_KAO }}", "FAL_KEY": "${{ secrets.FAL_KEY }}", "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}"}, "run": "(pip install -q pillow || sudo apt-get install -y -qq python3-pil) && python3 copertine_cinema_kao.py"}, {"name": "Scarica le prove", "if": "always()", "uses": "actions/upload-artifact@v4", "with": {"name": "prova-kao-piatto", "path": "kao_copertine/piatto_prova\nkao_copertine/cinema_anteprima.jpg", "if-no-files-found": "ignore"}}]}}}
