{"name": "Rotatore CTR", "on": {"schedule": [{"cron": "41 */6 * * *"}], "workflow_dispatch": {"inputs": {"config": {"description": "config dal foglio (la manda n8n)", "default": ""}}}}, "concurrency": {"group": "rotatore-ctr"}, "permissions": {"contents": "write", "actions": "write"}, "jobs": {"ctr": {"runs-on": "ubuntu-latest", "timeout-minutes": 40, "steps": [{"name": "Nascondi chiavi e token del payload (repository pubblico)", "run": "python3 - <<'PY'\nimport json, os\nev = json.load(open(os.environ['GITHUB_EVENT_PATH']))\nraw = (ev.get('inputs') or {}).get('payload') or (ev.get('inputs') or {}).get('config') or ''\ntry:\n    p = json.loads(raw)\nexcept Exception:\n    p = {}\nfor k, v in (p.items() if isinstance(p, dict) else []):\n    if any(w in str(k).lower() for w in ('token', 'secret', 'password', 'api_key', 'apikey')) and len(str(v).strip()) > 8:\n        print('::add-mask::' + str(v).strip())\nPY"}, {"uses": "actions/checkout@v4"}, {"name": "Rotatore", "env": {"CONFIG": "${{ inputs.config }}", "SEGRETI": "${{ toJSON(secrets) }}", "GH_TOKEN": "${{ github.token }}", "YT_CLIENT_ID": "${{ secrets.YT_CLIENT_ID }}", "YT_CLIENT_SECRET": "${{ secrets.YT_CLIENT_SECRET }}"}, "run": "sudo apt-get install -y -qq python3-pil && python3 rotatore_ctr.py"}, {"name": "Salva", "if": "always()", "run": "git config user.name render-bot && git config user.email render-bot@users.noreply.github.com && git add ctr_test && git commit -m 'Rotatore CTR' && git pull --rebase -q && git push || true"}]}}}