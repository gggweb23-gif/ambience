name: Video da caricare a mano (pagina unica)

# Raccoglie gli zip "DA CARICARE <canale>" delle ultime 30 ore in UNA pagina (Release "Video da caricare"):
# per ogni canale il video e la copertina con il nome del canale davanti. Link fisso per Giorgio:
# https://github.com/gggweb23-gif/ambience/releases/tag/da-caricare
on:
  schedule:
    - cron: '50 5 * * *'    # 06:50 ora italiana, quando i video della notte sono pronti
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: da-caricare

jobs:
  pagina:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepara la pagina
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          set -e
          pip install -q google-auth requests
          python3 strumenti/pagina_da_caricare.py
          gh release delete da-caricare -R "$R" --yes --cleanup-tag || true
          if ls f/* >/dev/null 2>&1; then F=(f/*); else F=(); fi
          gh release create da-caricare -R "$R" --title "VIDEO DA CARICARE - aggiornato $(TZ=Europe/Rome date '+%d/%m %H:%M')" --notes-file note.md "${F[@]}"
