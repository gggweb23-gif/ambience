name: Video Produzione

# MOTORE DI PRODUZIONE: un solo workflow per tutti i canali che prima passavano dal PRODUCTION di n8n (KAO PSICOLOGIA, Agora of Sages, i prossimi...).
# Lo lancia n8n ("MULTICHANNEL - GitHub Video") quando nella riga del canale in Channel Configs: github_workflow = video_produzione.yml.
# Il canale YouTube su cui caricare si sceglie dalla colonna chiave_youtube (nome del secret, es. YT_REFRESH_TOKEN_KAO).
# Programma: motore/motore.js  |  copioni di riferimento: esempi_copioni/<nome-canale>

on:
  workflow_dispatch:
    inputs:
      link_competitor:
        description: 'Link del video da copiare (lo passa n8n)'
        default: ''
        type: string
      prova:
        description: 'SI = prova (non caricata, oppure caricata non in elenco)'
        default: 'NO'
        type: string
      carica:
        description: 'SI = carica su YouTube'
        default: 'SI'
        type: string
      voce:
        description: 'Voce ElevenLabs (la passa n8n)'
        default: ''
        type: string
      payload:
        description: 'Solo per n8n (riga del canale)'
        default: ''
        type: string

permissions:
  contents: write
  actions: write   # rilancio di Copertina KAO singola se la copertina nuova non riesce

concurrency:
  group: produzione-${{ fromJSON(inputs.payload).canale }}   # un video alla volta per canale; canali diversi in parallelo
  cancel-in-progress: false

jobs:
  turno:   # mai due video con Pexels nello stesso momento: se un altro e' gia' in lavorazione, questo si rimanda al prossimo turno
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ok: ${{ steps.t.outputs.ok }}
    steps:
      - name: Nascondi chiavi e token del payload (repository pubblico)
        run: |
          python3 - <<'PY'
          import json, os
          ev = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          raw = (ev.get('inputs') or {}).get('payload') or (ev.get('inputs') or {}).get('config') or ''
          try:
              p = json.loads(raw)
          except Exception:
              p = {}
          for k, v in (p.items() if isinstance(p, dict) else []):
              if any(w in str(k).lower() for w in ('token', 'secret', 'password', 'api_key', 'apikey')) and len(str(v).strip()) > 8:
                  print('::add-mask::' + str(v).strip())
          PY
      - uses: actions/checkout@v4
        with:
          sparse-checkout: strumenti
      - id: t
        name: Turno Pexels
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ inputs.payload }}
          PROVA: ${{ inputs.prova }}
          WORKFLOW_PEXELS: video_storia.yml,video_kao.yml,video_agora.yml,video_produzione.yml,filosofo.yml,kao_render.yml
        run: python3 strumenti/turno_pexels.py
      - name: Rimandato -> la riga torna Pronto (avvio senza n8n)
        if: ${{ steps.t.outputs.ok != 'true' }}
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          PAYLOAD: ${{ inputs.payload }}
          ESITO: '{"stato": "RIMANDATO"}'
        run: pip install -q google-auth requests && python3 strumenti/esito_foglio.py || echo "esito non scritto nel foglio"

  video:
    needs: turno
    if: needs.turno.outputs.ok == 'true'
    name: ${{ fromJSON(inputs.payload).canale }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Nascondi chiavi e token del payload (repository pubblico)
        run: |
          python3 - <<'PY'
          import json, os
          ev = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          raw = (ev.get('inputs') or {}).get('payload') or (ev.get('inputs') or {}).get('config') or ''
          try:
              p = json.loads(raw)
          except Exception:
              p = {}
          for k, v in (p.items() if isinstance(p, dict) else []):
              if any(w in str(k).lower() for w in ('token', 'secret', 'password', 'api_key', 'apikey')) and len(str(v).strip()) > 8:
                  print('::add-mask::' + str(v).strip())
          PY
      - uses: actions/checkout@v4

      - name: Installa FFmpeg, font, whisper e Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core python3-pil python3-fonttools
          mkdir -p font
          if [ ! -f font/CormorantGaramond-SemiBold.ttf ]; then
            npm pack @fontsource/cormorant-garamond@5.3.0 --silent
            tar xzf fontsource-cormorant-garamond-5.3.0.tgz
            python3 -c "from fontTools.ttLib import TTFont; f=TTFont('package/files/cormorant-garamond-latin-600-normal.woff'); f.flavor=None; f.save('font/CormorantGaramond-SemiBold.ttf')"
          fi
          pip install -q faster-whisper pillow playwright && python -m playwright install --with-deps chromium
          npm install --prefix motore --silent --no-audit --no-fund luxon@3
          node --version && ffmpeg -version | head -1

      - name: Recupera le risposte gia' pagate di un giro fallito (solo canali con riprendi_lavoro = SI; mai KAO)
        id: rid
        env:
          PAYLOAD: ${{ inputs.payload }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(python3 -c "import json,os,re;p=json.loads(os.environ.get('PAYLOAD') or '{}');print(re.sub(r'[^a-z0-9]+','_',str(p.get('canale') or p.get('channel_name') or '').lower()).strip('_') if str(p.get('riprendi_lavoro') or '').strip().upper()=='SI' else '')")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          [ -n "$ID" ] || { echo "ripresa non attiva per questo canale"; exit 0; }
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=lavoro-produzione-$ID&per_page=10" --jq '[.artifacts[] | select(.expired==false)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$AID" ]; then echo "nessun lavoro salvato: si parte da zero"; exit 0; fi
          mkdir -p lavoro_ripresa
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > lavoro.zip && unzip -o -q lavoro.zip -d lavoro_ripresa && rm lavoro.zip
          echo "ripreso=SI" >> "$GITHUB_OUTPUT"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID" || true   # si usa una volta sola: se anche questo giro si ferma, il prossimo riparte da zero
          echo "lavoro salvato trovato:"; ls lavoro_ripresa | wc -l

      - name: Crea e carica il video
        env:
          PAYLOAD: ${{ inputs.payload }}
          PROVA: ${{ inputs.prova }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets[fromJSON(inputs.payload).chiave_youtube] }}
          WHISPER_MODEL: small
          GH_TOKEN: ${{ github.token }}
        run: node motore/motore.js
      - name: Esito nel file di produzione (avvio senza n8n)
        if: ${{ always() }}
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          PAYLOAD: ${{ inputs.payload }}
          STATO_JOB: ${{ job.status }}
        run: (python3 -c "import google.auth" 2>/dev/null || pip install -q google-auth requests) && python3 strumenti/esito_foglio.py || echo "esito non scritto nel foglio"

      - name: Salva le risposte gia' pagate per ripartire senza ripagarle (solo se il giro non e' finito bene e non era gia' una ripresa)
        if: ${{ (failure() || cancelled()) && steps.rid.outputs.id != '' && steps.rid.outputs.ripreso != 'SI' }}
        uses: actions/upload-artifact@v4
        with:
          name: lavoro-produzione-${{ steps.rid.outputs.id }}
          path: lavoro_ripresa/
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true

      - name: Costo del video (storico per il coach automatico)
        if: ${{ always() }}
        env:
          ESITO: ${{ job.status }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          python3 coach/registra_costo.py costi_video.jsonl || exit 0
          [ -n "$(git status --porcelain coach/costi)" ] || exit 0
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add coach/costi; git commit -m "Costo video" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done

      - name: Salva i nuovi ritratti nel repository (canali con statue/filosofi)
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain ritratti libreria_agora kao_copertine/registri 2>/dev/null)" ]; then
            git config user.name "render-bot"
            git config user.email "render-bot@users.noreply.github.com"
            git add ritratti libreria_agora 2>/dev/null || git add ritratti
            git add kao_copertine/registri 2>/dev/null || true
            git commit -m "Ritratti e registro copertina"
            git pull --rebase -q || true
            git push || echo "ritratto non salvato (verra' ricreato la prossima volta)"
          fi

      - name: Video di prova (se non caricato)
        if: ${{ always() && inputs.prova == 'SI' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-prova
          path: |
            lavoro_kao/video_finale.mp4
            lavoro_filosofo/video_finale.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Lancia subito il prossimo canale in attesa del turno Pexels (non aspetta il cron, che su GitHub arriva anche con un'ora di ritardo)
        if: ${{ always() && inputs.prova != 'SI' && contains(inputs.payload, 'riga_produzione') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run avvio_canali.yml --ref main -R "$GITHUB_REPOSITORY" -f escludi_run="$GITHUB_RUN_ID" || true
