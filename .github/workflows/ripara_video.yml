name: Ripara un video caricato (copertina e playlist)

# strumenti/ripara_video.py: copertina e/o playlist di un video gia' su YouTube (es. quota esaurita durante il caricamento). Gratis.
on:
  workflow_dispatch:
    inputs:
      chiave_youtube:
        description: 'Segreto YouTube del canale (colonna chiave_youtube), es. YT_REFRESH_TOKEN_FACES_OF_ROME'
        required: true
        type: string
      video_id:
        required: true
        type: string
      copertina:
        description: 'Percorso dell immagine nel repository o indirizzo https (vuoto = non toccare la copertina)'
        default: ''
        type: string
      playlist:
        description: 'Nome della playlist (vuoto = non toccare le playlist)'
        default: ''
        type: string
      privato:
        description: 'SI = togli la programmazione e lascia il video privato (non lo cancella)'
        default: ''
        type: string
      titolo:
        description: 'Titolo nuovo (vuoto = non cambiare)'
        default: ''
        type: string

permissions:
  contents: read

jobs:
  ripara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ripara
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          COPERTINA: ${{ inputs.copertina }}
          PLAYLIST: ${{ inputs.playlist }}
          PRIVATO: ${{ inputs.privato }}
          TITOLO: ${{ inputs.titolo }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets[inputs.chiave_youtube] }}
        run: python3 strumenti/ripara_video.py
