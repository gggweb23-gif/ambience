name: Prova voci notizie
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  voci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Voci
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 strumenti/prova_voci_notizie.py
      - name: Salva
        if: ${{ always() }}
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add prove_video/voci_notizie || true
          if ! git diff --cached --quiet; then git commit -qm "Prova voci notizie"; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*5)); done; fi
