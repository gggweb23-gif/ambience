name: Fotogrammi di controllo da un video (artifact di un run, gratis)
on:
  workflow_dispatch:
    inputs:
      run_id: {type: string, required: true}
      artifact: {type: string, required: true}
      quanti: {type: string, default: '12'}
      cartella: {type: string, default: 'prove_video/fotogrammi'}
permissions:
  contents: write
  actions: read
jobs:
  fotogrammi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scarica il video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/a && gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" -n "${{ inputs.artifact }}" -D /tmp/a
          ls -la /tmp/a | head -30
      - name: Estrai i fotogrammi
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          V=$(find /tmp/a -name '*.mp4' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          echo "video: $V"; D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$V"); echo "durata $D"
          OUT="${{ inputs.cartella }}"; rm -rf "$OUT"; mkdir -p "$OUT"; N=${{ inputs.quanti }}
          for i in $(seq 1 $N); do t=$(python3 -c "print(round($D*($i-0.5)/$N,1))"); ffmpeg -v error -ss $t -i "$V" -frames:v 1 -vf scale=1280:-2 -q:v 3 "$OUT/f_$(printf %02d $i)_${t}s.jpg"; done
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$V" > "$OUT/risoluzione.txt"
      - name: Salva nel repository
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add "${{ inputs.cartella }}"; git commit -m "Fotogrammi di controllo" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done
