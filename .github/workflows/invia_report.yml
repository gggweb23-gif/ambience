name: Invia report per email
# 9 nov: invia per email l'ultimo foglio Excel delle performance (prova o reinvio).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Invia
        env:
          GMAIL_UTENTE: ${{ secrets.GMAIL_UTENTE }}
          GMAIL_PASSWORD_APP: ${{ secrets.GMAIL_PASSWORD_APP }}
          EMAIL_REPORT: ${{ secrets.EMAIL_REPORT }}
        run: python3 strumenti/invia_report.py
