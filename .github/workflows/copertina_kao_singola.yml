name: Copertina KAO singola
# Rifà la copertina (stile attuale, copia del competitor) di UN video KAO già su YouTube e la carica da sola.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID del video YouTube (le 11 lettere dopo v= oppure dal link di Studio)"
        required: true
permissions:
  contents: write
concurrency:
  group: copertine-kao
  cancel-in-progress: false
jobs:
  copertina:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Copertina nuova per il video indicato
        env:
          SOLO: ${{ inputs.video_id }}
          APPLICA: "SI"
          STILE: "piatto"
          SFONDO_TESTO: "fumetto"
          PROVA_SFONDI: "NO"
          RIFAI: "SI"
          COACH: "NO"
          VARIANTI: "NO"
          TRE: "NO"
          COPERTINE_CSV: ${{ secrets.COPERTINE_CSV_KAO }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_KAO }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: (pip install -q pillow || sudo apt-get install -y -qq python3-pil) && python3 copertine_cinema_kao.py
      - name: Salva nel repo
        if: always()
        run: git config user.name render-bot && git config user.email render-bot@users.noreply.github.com && git add kao_copertine && git commit -m 'Copertina KAO singola' && git pull --rebase -q origin main && git push || echo niente da salvare
