name: Costo Vero - 3 prove di stile video + 3 copertine (prova, non carica)
on:
  workflow_dispatch:
    inputs:
      stili: {type: string, default: 'ABC'}
      copertine: {type: string, default: 'SI'}
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Programmi
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q --break-system-packages pillow json-repair requests faster-whisper
      - name: Copertine
        if: ${{ inputs.copertine == 'SI' }}
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python3 strumenti/copertine_costo_vero_concetti.py
      - name: Video
        if: ${{ inputs.stili != 'NO' }}
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          STILI: ${{ inputs.stili }}
        run: python3 strumenti/prova_costo_vero_stili.py
      - name: Video anche come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: costo-vero-stili
          path: prove_video/Costo_Vero/stili/*.mp4
          if-no-files-found: ignore
      - name: Salva nel repository
        if: always()
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          find prove_video/Costo_Vero/stili -size +49M -delete 2>/dev/null; git add prove_video/Costo_Vero/stili 2>/dev/null || true; git add prove_video/Costo_Vero/copertine_concetti 2>/dev/null || true
          git commit -m "Costo Vero: prove di stile e copertine" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done
