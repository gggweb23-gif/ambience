name: Cerca canali per tema (gratis)

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: nome, ricerche, filtro (regex titoli), escludi, giorni'
        required: true

permissions:
  contents: write

jobs:
  cerca:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cerca
        env:
          PAYLOAD: ${{ inputs.payload }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_ORBITAL_DAYS }}
        run: python3 strumenti/cerca_canali_tema.py
      - name: Salva
        if: ${{ always() }}
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add prove_video/ricerca || true; git commit -m "Ricerca canali per tema" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done
