name: Rimetti una riga di produzione a Pronto o scrivi l'esito (gratis)
on:
  workflow_dispatch:
    inputs:
      foglio:
        description: 'ID del file di produzione'
        required: true
        type: string
      link:
        description: 'Link video (colonna Link video) della riga'
        required: true
        type: string
      esito:
        description: 'Vuoto = la riga torna Pronto; oppure JSON esito del motore (es. stato PUBBLICATO, video_id, titolo, pubblica_il)'
        default: ''
        type: string
permissions:
  contents: read
jobs:
  pronto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Riga di nuovo Pronto
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          PAYLOAD: '{"foglio_produzione": "${{ inputs.foglio }}", "link": "${{ inputs.link }}", "canale": "riga"}'
          ESITO_IN: ${{ inputs.esito }}
        run: |
          if [ -n "$ESITO_IN" ]; then export ESITO="$ESITO_IN"; else export ESITO='{"stato": "RIMANDATO"}'; fi
          pip install -q google-auth requests && python3 strumenti/esito_foglio.py
