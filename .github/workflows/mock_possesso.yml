name: Mock Possesso
# 9 nov: 3 fotogrammi di esempio del formato "possesso" livello 2 (sfondo AI + grafica in codice). Circa 0,24 $.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Programmi
        run: pip install -q --break-system-packages pillow
      - name: Fotogrammi
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python3 strumenti/mock_possesso.py
      - name: Salva nel repository
        if: ${{ always() }}
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add prove_video/Mock_Possesso; git commit -m "Mock possesso" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done
