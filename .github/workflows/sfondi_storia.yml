name: Sfondi Storia

on:
  workflow_dispatch:

jobs:
  sfondi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Crea gli sfondi
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python3 sfondi_storia.py
      - name: Salva il risultato
        uses: actions/upload-artifact@v4
        with:
          name: sfondi-storia
          path: sfondi/
          retention-days: 7
