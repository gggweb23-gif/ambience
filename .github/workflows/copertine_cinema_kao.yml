{"name":"Copertine Cinema KAO","on":{"schedule":[{"cron":"23 */3 * * *"}],"workflow_dispatch":{"inputs":{"applica":{"description":"SI = carica su YouTube, NO = solo prova","default":"SI"},"solo":{"description":"Prova: ID dei video separati da virgola (vuoto = tutti i nuovi)","default":""}}}},"concurrency":{"group":"copertine-kao"},"permissions":{"contents":"write"},"jobs":{"copertine":{"runs-on":"ubuntu-latest","timeout-minutes":60,"steps":[{"uses":"actions/checkout@v4"},{"name":"Copertine","env":{"APPLICA":"${{ inputs.applica || 'SI' }}","SOLO":"${{ inputs.solo }}","DAL":"2026-09-21","COPERTINE_CSV":"${{ secrets.COPERTINE_CSV_KAO }}","YT_CLIENT_ID":"${{ secrets.YT_CLIENT_ID }}","YT_CLIENT_SECRET":"${{ secrets.YT_CLIENT_SECRET }}","YT_REFRESH_TOKEN":"${{ secrets.YT_REFRESH_TOKEN_KAO }}","FAL_KEY":"${{ secrets.FAL_KEY }}","ANTHROPIC_API_KEY":"${{ secrets.ANTHROPIC_API_KEY }}"},"run":"sudo apt-get install -y -qq python3-pil && python3 copertine_cinema_kao.py"},{"name":"Salva","if":"always()","run":"git config user.name render-bot && git config user.email render-bot@users.noreply.github.com && git add kao_copertine && git commit -m 'Copertine cinema KAO' && git pull --rebase -q && git push || true"}]}}}
