{"name": "Copertine Cinema KAO", "on": {"schedule": [{"cron": "23 * * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "concurrency": {"group": "copertine-kao", "cancel-in-progress": false}, "jobs": {"copertine": {"runs-on": "ubuntu-latest", "timeout-minutes": 60, "steps": [{"uses": "actions/checkout@v4"}, {"name": "Copertina dei nuovi video KAO (stile approvato 20/10)", "env": {"APPLICA": "SI", "STILE": "piatto", "SFONDO_TESTO": "fumetto", "PROVA_SFONDI": "NO", "DAL": "2026-10-21", "RIFAI": "NO", "COACH": "NO", "MAX_VIDEO": "5", "COPERTINE_CSV": "${{ secrets.COPERTINE_CSV_KAO }}", "YT_CLIENT_ID": "${{ secrets.YT_CLIENT_ID }}", "YT_CLIENT_SECRET": "${{ secrets.YT_CLIENT_SECRET }}", "YT_REFRESH_TOKEN": "${{ secrets.YT_REFRESH_TOKEN_KAO }}", "FAL_KEY": "${{ secrets.FAL_KEY }}", "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}"}, "run": "(pip install -q pillow || sudo apt-get install -y -qq python3-pil) && python3 copertine_cinema_kao.py"}, {"name": "Salva nel repo", "if": "always()", "run": "git config user.name render-bot && git config user.email render-bot@users.noreply.github.com && git add kao_copertine && git commit -m 'Copertine KAO' && git pull --rebase -q origin main && git push || echo niente da salvare"}]}}}
