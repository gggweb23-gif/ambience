name: Notizie del giorno
run-name: Notizie ${{ inputs.filone || 'tech' }} ${{ (inputs.produci == 'SI' || inputs.da_canali == 'SI' || github.event_name == 'schedule') && '(radar + video)' || '(radar)' }}

# Sistema notizie (16 nov 2026): ogni mattina il radar trova le notizie del filone piu' viste su YouTube, con una persona da mettere in copertina,
# e decide se restare sull'onda di ieri o cambiare. Se produci = SI (a mano) o la variabile del repository NOTIZIE_PRODUCI = SI (ogni giorno):
# copione con fonti verificate -> video 9-10 min in inglese e in italiano (stesse immagini). Il video 1440p resta negli artefatti del giro,
# nel repository copertina, anteprima 720p, costi e fonti.
# Quali canali producono e caricano lo decide notizie/canali.json (guerra_en, guerra_it, tech_en, tech_it: SI/NO).
on:
  schedule:
    - cron: '13 5 * * *'   # tech: radar + video dei canali tech attivi in notizie/canali.json
    - cron: '23 5 * * *'   # guerra: radar + video dei canali guerra attivi; escono all'ora_uscita di notizie/canali.json (IT 10:00, EN 17:00)
  workflow_dispatch:
    inputs:
      filone: {description: 'filone (tech)', default: 'tech', type: string}
      produci: {description: 'SI = anche copione e video', default: 'NO', type: string}
      lingue: {description: 'lingue del video', default: 'en,it', type: string}
      salta_radar: {description: 'SI = usa la storia gia scelta (onda.json)', default: 'NO', type: string}
      carica: {description: 'SI = carica su YouTube (guerra: WWII Testimony)', default: 'NO', type: string}
      minuti: {description: 'durata del video in minuti (prova: 1.2)', default: '9.5', type: string}
      prova: {description: 'SI = prova (non tocca la storia di domani)', default: 'NO', type: string}
      copione: {description: 'Riparazione: rifai solo il video da questi copioni gia scritti (es. notizie/auto/x_en.json, separati da spazio), senza radar e senza ripagare Claude', default: '', type: string}
      da_canali: {description: 'SI = come il giro del mattino: decide notizie/canali.json (lo usa avvio_canali.yml)', default: 'NO', type: string}

concurrency:
  group: notizie-${{ inputs.filone || github.event.schedule }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notizie:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      FILONE: ${{ inputs.filone || (github.event.schedule == '23 5 * * *' && 'guerra') || 'tech' }}
      LINGUE_A_MANO: ${{ inputs.lingue }}
      COPIONE_RIPARA: ${{ inputs.copione }}
      PRODUCI_A_MANO: ${{ inputs.da_canali != 'SI' && inputs.produci || '' }}
      CARICA_A_MANO: ${{ inputs.carica }}
      BUDGET_VIDEO: '4.6'   # 16 nov 21:36, Giorgio: "Confermo" -> tetto 4 euro a video inglese (4,60 $); l'italiano riusa le immagini
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      YT_REFRESH_TOKEN_WWII_TESTIMONY: ${{ secrets.YT_REFRESH_TOKEN_WWII_TESTIMONY }}
      YT_REFRESH_TOKEN_STORIA: ${{ secrets.YT_REFRESH_TOKEN_STORIA }}
      YT_REFRESH_TOKEN_MAIN_STREET_ATLAS: ${{ secrets.YT_REFRESH_TOKEN_MAIN_STREET_ATLAS }}
      YT_REFRESH_TOKEN_COSTO_VERO: ${{ secrets.YT_REFRESH_TOKEN_COSTO_VERO }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YT_API_KEY_NOTIZIE: ${{ secrets.YT_API_KEY_NOTIZIE }}
      YT_API_KEY_RADAR: ${{ secrets.YT_API_KEY_RADAR }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      MINUTI: ${{ inputs.minuti || '9.5' }}
      PROVA: ${{ inputs.prova || 'NO' }}
    steps:
      - uses: actions/checkout@v4
      - name: Canali attivi (notizie/canali.json)
        run: |
          python3 - <<'PY'
          import json, os
          E = os.environ.get; c = json.load(open('notizie/canali.json')); f = E('FILONE')
          en, it = c.get(f + '_en', {}).get('attivo') == 'SI', c.get(f + '_it', {}).get('attivo') == 'SI'
          if E('PRODUCI_A_MANO'):   # giro a mano: decidono gli input
              produci, lingue, carica = E('PRODUCI_A_MANO'), E('LINGUE_A_MANO') or 'en,it', E('CARICA_A_MANO') or 'NO'
          else:
              produci = 'SI' if (en or it) else 'NO'; lingue = 'en' + (',it' if it else ''); carica = 'SI'
          # mai due video dello stesso filone nello stesso giorno (giro programmato in ritardo + giro lanciato a mano)
          import datetime as dt, subprocess
          segno = f"notizie/fatti/{f}_{dt.date.today().isoformat()}.txt"
          if produci == 'SI' and carica == 'SI' and not E('COPIONE_RIPARA'):   # una riparazione (copione gia scritto) passa sempre
              if os.path.exists(segno):
                  print('video di oggi gia in produzione/fatto da un altro giro:', open(segno).read()); produci = 'NO'
              else:
                  os.makedirs('notizie/fatti', exist_ok=True); open(segno, 'w').write(E('GITHUB_RUN_ID', ''))
                  subprocess.run('git config user.name render-bot && git config user.email render-bot@users.noreply.github.com && '
                                 f'git add {segno} && git commit -qm "Notizie {f}: giro di oggi" && (git pull --rebase -q; git push -q)', shell=True)
          open(E('GITHUB_ENV'), 'a').write(f'PRODUCI={produci}\nLINGUE={lingue}\nCARICA={carica}\n')
          print('filone', f, '| produci', produci, '| lingue', lingue, '| carica', carica, '| canali attivi:', [k for k, v in c.items() if isinstance(v, dict) and v.get('attivo') == 'SI'])
          PY
      - name: Libreria dei luoghi (immagini dei giorni scorsi)
        uses: actions/cache/restore@v4
        with:
          path: libreria_scene
          key: libreria-scene-${{ github.run_id }}
          restore-keys: libreria-scene-
      - name: Programmi
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install --quiet --break-system-packages pillow google-auth requests
      - name: Radar
        if: ${{ inputs.salta_radar != 'SI' && inputs.copione == '' }}
        run: python3 strumenti/notizie_radar.py
      - name: Salva radar
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add notizie/radar && (git diff --cached --quiet || git commit -qm "Radar notizie $FILONE")
          for i in 1 2 3 4 5; do (git pull --rebase -q || { git rebase --abort; git pull --rebase -q -X theirs; }) && git push -q && break; sleep $((i*5)); done   # 18 nov: conflitto col giro dell'altro filone -> si tiene il nostro file, mai copioni persi
      - name: Copione (con fonti verificate)
        id: copione
        if: ${{ env.PRODUCI == 'SI' }}
        run: |
          if [ -n "${{ inputs.copione }}" ]; then echo "file=${{ inputs.copione }}" >> "$GITHUB_OUTPUT"; echo "copioni gia scritti: ${{ inputs.copione }}"; exit 0; fi
          python3 strumenti/notizie_copione.py
      - name: Video
        if: ${{ env.PRODUCI == 'SI' }}
        run: |
          for f in ${{ steps.copione.outputs.file }}; do
            echo "=== $f"; NOTIZIA=$f python3 video_notizie.py || echo "VIDEO NON RIUSCITO: $f"
          done
      - name: Libreria dei luoghi (salva)
        if: ${{ always() && env.PRODUCI == 'SI' }}
        uses: actions/cache/save@v4
        with:
          path: libreria_scene
          key: libreria-scene-${{ github.run_id }}
      - name: Video 1440p (artefatto)
        if: ${{ always() && env.PRODUCI == 'SI' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-notizie
          path: video_pieni/
          retention-days: 14
          if-no-files-found: ignore
      - name: Carica su YouTube (canali attivi)
        if: ${{ env.PRODUCI == 'SI' && env.CARICA == 'SI' }}
        run: |
          for f in ${{ steps.copione.outputs.file }}; do
            n=$(python3 -c "import json;print(json.load(open('$f'))['nome'])")
            l=$(python3 -c "import json;print(json.load(open('$f')).get('lingua','en'))")
            tk=$(python3 -c "import json;c=json.load(open('notizie/canali.json')).get('${FILONE}_$l',{});print(c.get('token','') if c.get('attivo')=='SI' else '')")
            if [ -z "$tk" ]; then echo "canale ${FILONE}_$l non attivo: non carico $f"; continue; fi
            if [ -f video_pieni/$n.mp4 ]; then v=video_pieni/$n.mp4; else v=prove_video/notizie/$n/video.mp4; fi
            cid=$(python3 -c "import json;print(json.load(open('notizie/canali.json')).get('${FILONE}_$l',{}).get('channel_id',''))")
            pl=$(python3 -c "import json;print(json.load(open('notizie/canali.json')).get('${FILONE}_$l',{}).get('playlist',''))")
            ora=$(python3 -c "import json;print(json.load(open('notizie/canali.json')).get('${FILONE}_$l',{}).get('ora_uscita','17:00'))")
            ORA_USCITA="$ora" NOTIZIA=$f VIDEO=$v CANALE_ID="$cid" PLAYLIST="$pl" COPERTINA=prove_video/notizie/$n/copertina.jpg YT_REFRESH_TOKEN="${!tk}" python3 strumenti/notizie_carica.py || echo "CARICAMENTO NON RIUSCITO: $f"
          done
      - name: Salva
        if: ${{ always() }}
        run: |
          git add notizie caricature 2>/dev/null || true
          git add -- prove_video/notizie ':(exclude)prove_video/notizie/*/materiali' 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -qm "Notizie $FILONE: copione e video"
            for i in 1 2 3 4 5; do (git pull --rebase -q || { git rebase --abort; git pull --rebase -q -X theirs; }) && git push -q && break; sleep $((i*5)); done   # 18 nov: conflitto col giro dell'altro filone -> si tiene il nostro file, mai copioni persi
          fi
