name: Prova modelli voce (stessa frase, modelli ElevenLabs diversi)

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: modelli [..], solo [channel_name], testo_it, testo_en'
        default: '{}'
        type: string

permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prova
        env:
          PAYLOAD: ${{ inputs.payload }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: pip install -q google-auth requests && python3 strumenti/prova_modelli_voce.py
      - name: Salva nel repository
        if: ${{ always() }}
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add prove_video/prova_modelli_voce; git commit -m "Prova modelli voce" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done
