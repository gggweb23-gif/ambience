name: Studio impression (sola lettura, gratis)

# Perche' sullo stesso canale alcuni video hanno impression e altri zero: raccoglie tutti i dati dei video di ogni canale
# (YouTube Data API, Analytics, report reach gia' esistenti, file di produzione) in studio_impression/. Non modifica nulla.
on:
  workflow_dispatch:
    inputs:
      captions:
        description: 'SI = legge anche i sottotitoli (50 unita di quota per video, max 4+4 per canale)'
        default: 'NO'
        type: string

permissions:
  contents: write

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Raccolta dati
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_KAO: ${{ secrets.YT_REFRESH_TOKEN_KAO }}
          YT_REFRESH_TOKEN_AGORA_OF_SAGES: ${{ secrets.YT_REFRESH_TOKEN_AGORA_OF_SAGES }}
          YT_REFRESH_TOKEN_MAIN_STREET_ATLAS: ${{ secrets.YT_REFRESH_TOKEN_MAIN_STREET_ATLAS }}
          YT_REFRESH_TOKEN_STORIA: ${{ secrets.YT_REFRESH_TOKEN_STORIA }}
          YT_REFRESH_TOKEN_ORBITAL_DAYS: ${{ secrets.YT_REFRESH_TOKEN_ORBITAL_DAYS }}
          YT_REFRESH_TOKEN_WWII_TESTIMONY: ${{ secrets.YT_REFRESH_TOKEN_WWII_TESTIMONY }}
          CAPTIONS: ${{ inputs.captions }}
        run: pip install -q google-auth requests pillow && python3 strumenti/studio_impression.py
      - name: Salva nel repository
        if: ${{ always() }}
        run: |
          git config user.name render-bot && git config user.email render-bot@users.noreply.github.com
          git add studio_impression && git commit -q -m "Studio impression: dati raccolti" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i * 5)); done
