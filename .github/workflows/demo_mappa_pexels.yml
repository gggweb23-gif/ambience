name: Demo mappa + Pexels (30 s, solo immagini)

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: cartella, demo ("123"), tema_colori'
        default: '{}'
        type: string

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Memoria di mappa, confini e caratteri
        uses: actions/cache@v4
        with:
          path: risorse_mappe
          key: risorse-mappe-v1
      - name: FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - name: Programmi Python
        run: pip install --quiet --break-system-packages cairosvg numpy pillow
      - name: Demo
        env:
          PAYLOAD: ${{ inputs.payload }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 strumenti/demo_mappa_pexels.py 2>&1 | tee demo.log
      - name: Salva nel repository
        if: ${{ always() }}
        run: |
          C=$(python3 -c "import json,os;print(json.loads(os.environ.get('P') or '{}').get('cartella') or 'prove_video/demo')")
          mkdir -p "$C"; cp demo.log "$C/demo.log" 2>/dev/null || true
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add prove_video; git commit -m "Demo mappa + Pexels" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done
        env:
          P: ${{ inputs.payload }}
