name: Verifica token YouTube (gratis)

on:
  workflow_dispatch:
    inputs:
      nome:
        description: 'Nome del segreto, es. YT_REFRESH_TOKEN_ORBITAL_DAYS'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verifica
        env:
          NOME: ${{ inputs.nome }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets[inputs.nome] }}
        run: python3 strumenti/verifica_token.py
      - name: Salva il risultato
        run: |
          mkdir -p prove_video && cp verifica_token.txt prove_video/verifica_token.txt
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add prove_video/verifica_token.txt; git commit -m "Verifica token" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
