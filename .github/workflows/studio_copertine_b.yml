name: Studio copertine stile B (etichetta rossa, ritocco AI)

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: nome, libreria, max_spesa, copertine [{titolo, testo, clip_n, prompt}]'
        required: true
        type: string

permissions:
  contents: write

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q pillow
      - name: Studio
        env:
          PAYLOAD: ${{ inputs.payload }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python3 strumenti/studio_copertine_b.py
      - name: Salva nel repository
        if: ${{ always() }}
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add prove_archivi; git commit -m "Studio copertine B" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i * 5)); done
