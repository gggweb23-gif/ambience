{"name":"Copertine Storia","on":{"schedule":[{"cron":"17 */3 * * *"}],"workflow_dispatch":{"inputs":{"video":{"description":"vuoto = video nuovi del canale; oppure nostroID:competitorID separati da virgola","default":""},"applica":{"description":"SI = carica la copertina 1 su YouTube, NO = solo prova","default":"SI"},"variante":{"description":"Solo per il Rotatore CTR (lascia vuoto)","default":""}}}},"concurrency":{"group":"copertine-storia"},"permissions":{"contents":"write","actions":"write"},"jobs":{"copertine":{"runs-on":"ubuntu-latest","timeout-minutes":40,"steps":[{"uses":"actions/checkout@v4"},{"name":"Copertine","env":{"VIDEO":"${{ inputs.video }}","APPLICA":"${{ inputs.applica || 'SI' }}","VARIANTE":"${{ inputs.variante }}","YT_CLIENT_ID":"${{ secrets.YT_CLIENT_ID }}","YT_CLIENT_SECRET":"${{ secrets.YT_CLIENT_SECRET }}","YT_REFRESH_TOKEN":"${{ secrets.YT_REFRESH_TOKEN_STORIA }}","FAL_KEY":"${{ secrets.FAL_KEY }}","ANTHROPIC_API_KEY":"${{ secrets.ANTHROPIC_API_KEY }}"},"run":"sudo apt-get install -y -qq python3-pil fonts-dejavu-core && python3 copertine_storia.py"},{"name":"Salva","if":"always()","run":"git config user.name render-bot && git config user.email render-bot@users.noreply.github.com && git add copertine_storia && git commit -m 'Copertine Storia' && git pull --rebase -q && git push || true"},{"name":"Rilancia il Rotatore","if":"${{ inputs.variante != '' }}","env":{"GH_TOKEN":"${{ github.token }}"},"run":"gh workflow run rotatore_ctr.yml --ref main"}]}}}
