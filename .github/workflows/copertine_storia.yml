{"name":"Copertine Storia","on":{"workflow_dispatch":{"inputs":{"video":{"description":"nostroID:competitorID separati da virgola","default":"VE7QUAgT45A:SKlh6sw60aA,9BOXlNXHk0E:qFM6suFTH2s,India:p9IIGdg91fE"},"applica":{"description":"SI = carica la copertina 1 su YouTube, NO = solo prova","default":"NO"}}}},"permissions":{"contents":"write"},"jobs":{"copertine":{"runs-on":"ubuntu-latest","timeout-minutes":40,"steps":[{"uses":"actions/checkout@v4"},{"name":"Copertine","env":{"VIDEO":"${{ inputs.video }}","APPLICA":"${{ inputs.applica }}","YT_CLIENT_ID":"${{ secrets.YT_CLIENT_ID }}","YT_CLIENT_SECRET":"${{ secrets.YT_CLIENT_SECRET }}","YT_REFRESH_TOKEN":"${{ secrets.YT_REFRESH_TOKEN_STORIA }}","FAL_KEY":"${{ secrets.FAL_KEY }}","ANTHROPIC_API_KEY":"${{ secrets.ANTHROPIC_API_KEY }}"},"run":"sudo apt-get install -y -qq python3-pil fonts-dejavu-core && python3 copertine_storia.py"},{"name":"Salva","if":"always()","run":"git config user.name render-bot && git config user.email render-bot@users.noreply.github.com && git add copertine_storia && git commit -m 'Copertine Storia' && git pull --rebase -q && git push || true"}]}}}
