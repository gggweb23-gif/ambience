name: Controllo di gestione canali

# Ogni mattina aggiorna il foglio "Controllo di Gestione Canali" (coach/controllo_gestione.py). Gratis: nessuna API a pagamento.
on:
  schedule:
    - cron: '17 4 * * *'   # 05:17 / 06:17 ora italiana
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gestione:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna il foglio
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          CONTROLLO_GESTIONE_ID: 1A2cHstdd6_AY5a9lPHQA1CCwTUmgYwGeL8afzMQVjHI
        run: pip install -q google-auth requests && python3 coach/controllo_gestione.py
