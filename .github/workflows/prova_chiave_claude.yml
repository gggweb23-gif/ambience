name: Prova chiave Claude (una parola, costo ~0,0001 $)
# 25 nov: controlla che il segreto ANTHROPIC_API_KEY funzioni dopo il cambio di chiave. Non stampa mai la chiave.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          k = os.environ.get('ANTHROPIC_API_KEY', '')
          print('chiave presente:', bool(k), '| finale:', k[-4:] if k else '-')
          req = urllib.request.Request('https://api.anthropic.com/v1/messages', method='POST',
              data=json.dumps({'model': 'claude-haiku-4-5-20251001', 'max_tokens': 5, 'messages': [{'role': 'user', 'content': 'Rispondi solo: OK'}]}).encode(),
              headers={'x-api-key': k, 'anthropic-version': '2023-06-01', 'content-type': 'application/json'})
          try:
              r = json.load(urllib.request.urlopen(req, timeout=60)); print('RISPOSTA:', r['content'][0]['text'])
          except urllib.error.HTTPError as e:
              print('ERRORE', e.code, e.read().decode()[:300]); raise SystemExit(1)
          PY
