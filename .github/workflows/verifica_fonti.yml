name: Verifica fonti libere (gratis)

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Ricerche separate da ; (es. roman soldier;roman lamp)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Conta le immagini libere
        env:
          QUERY: ${{ inputs.query }}
        run: python3 strumenti/verifica_fonti.py | tee verifica.txt
      - name: Salva il risultato nel repository
        run: |
          mkdir -p prove_video && cp verifica.txt prove_video/verifica_fonti.txt
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add prove_video/verifica_fonti.txt; git commit -m "Verifica fonti" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
