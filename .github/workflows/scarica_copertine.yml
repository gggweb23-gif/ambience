name: Scarica copertine (per analisi)

# 8 nov: scarica le copertine pubbliche di una lista di video (i.ytimg.com) in analisi_copertine/<cartella>/ per studiarle
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'ID video separati da virgola'
        required: true
      cartella:
        description: 'Nome cartella'
        required: true

permissions:
  contents: write

jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scarica
        run: |
          d="analisi_copertine/${{ inputs.cartella }}"; mkdir -p "$d"; i=0
          for v in $(echo "${{ inputs.ids }}" | tr ',' ' '); do
            i=$((i+1)); n=$(printf '%02d' $i)
            curl -sSfL -o "$d/${n}_$v.jpg" "https://i.ytimg.com/vi/$v/maxresdefault.jpg" || curl -sSfL -o "$d/${n}_$v.jpg" "https://i.ytimg.com/vi/$v/hqdefault.jpg" || echo "manca $v"
          done
          ls -la "$d"
          git config user.name render-bot && git config user.email render-bot@users.noreply.github.com
          git add analisi_copertine && git commit -m "Copertine per analisi" && (for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done) || echo niente
